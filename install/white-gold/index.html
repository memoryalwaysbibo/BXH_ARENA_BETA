<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>BXH ARENA｜白金大理石版圖標</title>
  <meta name="description" content="安裝 BXH ARENA 白金大理石版桌面圖標。">
  <meta name="theme-color" content="#b98a2f">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="BXH ARENA">
  <link rel="apple-touch-icon" sizes="180x180" href="/install/white-gold/icons/apple-touch-icon.png">
  <link rel="manifest" href="/install/white-gold/manifest.webmanifest">
  <style>
    :root{color-scheme:dark;--gold:#e3b653;--gold2:#fff0b2;--bg:#08090b;--panel:#121419;--muted:#a6a8ad}
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC",sans-serif;background:radial-gradient(circle at 50% 0,#32250e 0,#0b0c0f 38%,#050608 100%);color:#f8f5ec}
    body{min-height:100svh;display:flex;justify-content:center;padding:max(28px,env(safe-area-inset-top)) 20px max(36px,env(safe-area-inset-bottom))}
    main{width:min(100%,520px);display:flex;flex-direction:column;align-items:center;text-align:center}
    .eyebrow{margin-top:8px;font-size:12px;font-weight:800;letter-spacing:.24em;color:var(--gold)}
    h1{margin:10px 0 4px;font-size:30px;letter-spacing:.05em}
    .edition{margin:0;color:var(--gold2);font-size:16px;font-weight:700}
    .icon{width:190px;height:190px;margin:28px 0 22px;border-radius:42px;box-shadow:0 18px 55px #000,0 0 40px rgba(227,182,83,.26);border:1px solid rgba(255,230,160,.5)}
    .card{width:100%;padding:22px 20px;border-radius:22px;background:linear-gradient(145deg,rgba(31,32,35,.96),rgba(14,15,18,.96));border:1px solid rgba(227,182,83,.3);box-shadow:0 20px 60px rgba(0,0,0,.35)}
    .card h2{margin:0 0 16px;font-size:19px;color:var(--gold2)}
    ol{margin:0;padding:0;list-style:none;text-align:left;display:grid;gap:13px}
    li{display:grid;grid-template-columns:32px 1fr;gap:10px;align-items:center;color:#e6e6e8;line-height:1.5}
    li b{display:grid;place-items:center;width:30px;height:30px;border-radius:50%;background:var(--gold);color:#111;font-size:14px}
    .note{margin:17px 0 0;padding-top:15px;border-top:1px solid #34363c;color:var(--muted);font-size:13px;line-height:1.6}
    .back{margin-top:18px;color:var(--gold2);text-decoration:none;font-size:14px}
  </style>
  <script>
    if(window.navigator.standalone||window.matchMedia('(display-mode: standalone)').matches){location.replace('/');}
  </script>
</head>
<body>
  <main>
    <div class="eyebrow">BXH ARENA</div>
    <h1>桌面圖標安裝</h1>
    <p class="edition">白金大理石版</p>
    <img class="icon" src="icons/icon-512.png" alt="BXH ARENA 白金大理石版圖標">
    <section class="card">
      <h2>加入 iPhone 主畫面</h2>
      <ol>
        <li><b>1</b><span>點瀏覽器的「分享」按鈕</span></li>
        <li><b>2</b><span>選擇「加入主畫面」</span></li>
        <li><b>3</b><span>確認圖標後，點右上角「加入」</span></li>
      </ol>
      <p class="note">完成後，桌面會顯示這款白金大理石版圖標；點擊後仍會進入原本的 BXH ARENA。</p>
    </section>
    <a class="back" href="/">返回 BXH ARENA</a>
  </main>
</body>
</html>
