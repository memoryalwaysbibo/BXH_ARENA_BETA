<style>
:root{
  --bg:#08090a;
  --bg-soft:#0e0f11;
  --panel:#17181b;
  --panel-2:#1e2023;
  --panel-3:#26282c;
  --border:#2c2e33;
  --border-soft:#212327;
  --neon:#e9ff2e;
  --gold:#d9b95c;
  --gold-dim:#8a733a;
  --gold-glow:rgba(217,185,92,0.22);
  --obsidian:#070808;
  --imperial-gold:#D4AF37;
  --champagne-gold:#F3D98B;
  --bronze-gold:#8A6428;
  --ivory:#F7F2E8;
  --wine:#2A090D;
  --neon-dim:#b9c918;
  --neon-glow:rgba(233,255,46,0.18);
  --white:#f4f5f2;
  --metal:#9a9ea6;
  --metal-dim:#6c7078;
  --danger:#ff3b3b;
  --danger-dim:#5c1414;
  --danger-glow:rgba(255,59,59,0.18);
  --ok:#3ddc84;
  --radius:12px;
  --radius-sm:8px;
  --font-d:'Rajdhani','Noto Sans TC',sans-serif;
  --font-b:'Noto Sans TC',-apple-system,BlinkMacSystemFont,sans-serif;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg);
  color:var(--white);
  font-family:var(--font-b);
  min-height:100vh;
  -webkit-tap-highlight-color:transparent;
  overflow-x:hidden;
}
button{font-family:inherit;cursor:pointer;}
input,select,textarea{font-family:inherit;}
::-webkit-scrollbar{height:8px;width:8px;}
::-webkit-scrollbar-thumb{background:var(--panel-3);border-radius:4px;}
::-webkit-scrollbar-track{background:transparent;}

#watermark{
  position:fixed;top:0;left:0;right:0;bottom:0;
  display:flex;align-items:center;justify-content:center;
  pointer-events:none;z-index:0;
  opacity:0.055;
}
#watermark img{width:100%;height:100%;object-fit:contain;}
@media (max-width:640px){
  #watermark{opacity:0.045;}
  #watermark img{width:100%;height:100%;object-fit:contain;}
}
@media (max-width:420px){
  #watermark{opacity:0.04;}
}

#app{position:relative;z-index:1;min-height:100vh;display:flex;flex-direction:column;}

.stickytop{position:sticky;top:0;z-index:20;}
header.topbar{
  position:relative;
  display:flex;align-items:center;gap:24px;
  padding:16px 28px;
  background:linear-gradient(180deg, #101113, #08090a);
  border-bottom:1px solid var(--border);
  backdrop-filter:blur(6px);
}
header.topbar::after{
  content:"";
  position:absolute;left:0;bottom:0;width:100%;height:2px;
  background:var(--neon);
  opacity:0.5;
  pointer-events:none;
}
header.topbar .logo-wrap{
  position:relative;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  margin-left:4px;
}
header.topbar .logo-glow{
  position:absolute;left:50%;top:50%;
  width:150%;height:150%;
  transform:translate(-50%,-50%);
  background:radial-gradient(circle, rgba(233,255,46,0.14) 0%, rgba(233,255,46,0.05) 40%, transparent 72%);
  pointer-events:none;
  z-index:0;
}
header.topbar img.logo{position:relative;z-index:1;height:84px;width:auto;display:block;flex-shrink:0;}
header.topbar .brandtext{display:flex;flex-direction:column;line-height:1.15;min-width:0;position:relative;z-index:1;}
header.topbar .brandtext .t1{
  font-family:var(--font-d);font-weight:700;font-size:25px;letter-spacing:3px;
  white-space:nowrap;transform:skewX(-7deg);display:inline-block;
}
header.topbar .brandtext .t1 .w-bxh{color:var(--white);text-shadow:0 0 1px rgba(255,255,255,0.25);}
header.topbar .brandtext .t1 .w-arena{color:var(--neon);margin-left:9px;text-shadow:0 0 14px rgba(233,255,46,0.35);}
header.topbar .brandtext .t2{
  font-size:13.5px;color:#c7cad0;letter-spacing:2.5px;margin-top:6px;white-space:nowrap;font-weight:500;
}
header.topbar .brandtext .top-connection-state{
  position:relative;display:grid;grid-template-columns:auto minmax(0,1fr);grid-template-areas:"kicker kicker" "rail rail" "status status";
  gap:4px;margin-top:8px;padding-left:10px;max-width:190px;
}
header.topbar .brandtext .top-connection-state::before{
  content:"";position:absolute;left:0;top:2px;width:2px;height:30px;
  background:linear-gradient(180deg,var(--gold),rgba(217,185,92,.16));
  transform:skewX(-18deg);box-shadow:0 0 8px rgba(217,185,92,.24);
}
header.topbar .brandtext .t-conn-kicker{
  grid-area:kicker;font-family:var(--font-d);font-weight:900;font-size:8px;letter-spacing:1.8px;color:var(--gold);
  line-height:1;text-transform:uppercase;opacity:.92;
}
header.topbar .brandtext .t-rule{
  grid-area:rail;position:relative;overflow:visible;width:132px;height:13px;margin:0;border-radius:999px;color:#45ef98;
}
header.topbar .brandtext .t-rule::before{
  content:"";position:absolute;left:0;right:0;top:50%;height:1.5px;transform:translateY(-50%);border-radius:999px;
  background:linear-gradient(90deg,transparent 0%,currentColor 12%,currentColor 86%,transparent 100%);opacity:.26;
  box-shadow:0 0 8px color-mix(in srgb,currentColor 30%,transparent);
}
header.topbar .brandtext .t-rule::after{
  content:"";position:absolute;left:0;top:50%;width:7px;height:7px;border-radius:50%;background:currentColor;
  transform:translate(0,-50%);box-shadow:0 0 5px currentColor,0 0 13px currentColor,0 0 24px color-mix(in srgb,currentColor 72%,transparent);
  animation:topbarLifeDot 2.1s linear infinite;
}
header.topbar .brandtext .t-rule.connected{color:#45ef98;}
header.topbar .brandtext .t-rule.connecting{color:#e8c547;}
header.topbar .brandtext .t-rule.connecting::after{animation-duration:1.25s;}
header.topbar .brandtext .t-rule.error{color:#ff6262;}
header.topbar .brandtext .t-rule.limited{color:#e8c547;}
header.topbar .brandtext .t-rule.limited::after{animation-duration:1.6s;}
header.topbar .brandtext .t-rule.error::after{animation:topbarLifeError .95s ease-in-out infinite;}
header.topbar .brandtext .t-rule.local{color:#7a8088;}
header.topbar .brandtext .t-rule.local::after{animation-duration:2.8s;opacity:.58;}
header.topbar .brandtext .t-conn-status{
  grid-area:status;display:flex;align-items:center;gap:6px;min-width:0;font-size:9.5px;letter-spacing:.7px;color:#aeb5bf;font-weight:750;line-height:1.1;
}
header.topbar .brandtext .t-conn-status strong{font-family:var(--font-d);font-size:9px;letter-spacing:1px;color:currentColor;}
header.topbar .brandtext .t-conn-dot{width:6px;height:6px;border-radius:50%;display:inline-block;flex:0 0 auto;box-shadow:0 0 10px currentColor;}
header.topbar .brandtext .t-conn-dot.connected{background:#3ddc84;color:#3ddc84;}
header.topbar .brandtext .t-conn-dot.connecting{background:#e8c547;color:#e8c547;animation:cloud-pulse 1s ease-in-out infinite;}
header.topbar .brandtext .t-conn-dot.error{background:#ff6666;color:#ff6666;animation:topbarLifeError .95s ease-in-out infinite;}
header.topbar .brandtext .t-conn-dot.limited{background:#e8c547;color:#e8c547;animation:cloud-pulse 1.4s ease-in-out infinite;}
header.topbar .brandtext .t-conn-dot.local{background:#7a8088;color:#7a8088;}
@keyframes topbarLifeDot{
  0%{left:0;top:50%;opacity:.15}
  8%{opacity:1}
  42%{left:44%;top:50%}
  48%{left:50%;top:5%}
  54%{left:56%;top:50%}
  92%{opacity:1}
  100%{left:calc(100% - 7px);top:50%;opacity:.12}
}
@keyframes topbarLifeError{0%,100%{opacity:.28;transform:translate(54px,-50%) scale(.82)}50%{opacity:1;transform:translate(54px,-50%) scale(1.18)}}
header.topbar .spacer{flex:1;position:relative;z-index:1;}
header.topbar .status-pill{position:relative;z-index:1;
  font-family:var(--font-d);font-weight:600;font-size:13px;
  padding:6px 14px;border-radius:20px;border:1px solid var(--border);
  white-space:nowrap;flex-shrink:0;
}
@media (max-width:640px){
  header.topbar{padding:12px 16px;gap:14px;}
  header.topbar img.logo{height:70px;}
  header.topbar .brandtext .t1{font-size:18px;letter-spacing:1.6px;}
  header.topbar .brandtext .t1 .w-arena{margin-left:6px;}
  header.topbar .brandtext .t2{font-size:10.5px;letter-spacing:1.5px;margin-top:4px;}
  header.topbar .brandtext .top-connection-state{gap:3px;margin-top:6px;max-width:150px;padding-left:8px;}
  header.topbar .brandtext .top-connection-state::before{height:27px;}
  header.topbar .brandtext .t-rule{width:105px;height:12px;}
  header.topbar .brandtext .t-conn-kicker{font-size:7px;letter-spacing:1.25px;}
  header.topbar .brandtext .t-conn-status{font-size:8px;letter-spacing:.45px;}
}
@media (max-width:380px){
  header.topbar{padding:10px 12px;gap:10px;}
  header.topbar img.logo{height:64px;}
  header.topbar .brandtext .t1{font-size:15px;letter-spacing:1px;}
  header.topbar .status-pill{font-size:11px;padding:5px 10px;}
}
.status-waiting{color:var(--metal);border-color:var(--border);}
.status-live{color:var(--danger);border-color:var(--danger);background:var(--danger-glow);}
.status-done{color:var(--neon);border-color:var(--neon-dim);background:var(--neon-glow);}

nav.tabs{
  display:flex;flex-wrap:nowrap;gap:4px;padding:8px 12px;overflow-x:auto;overflow-y:hidden;
  background:var(--bg-soft);border-bottom:1px solid var(--border);
  scrollbar-width:none;-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain;touch-action:pan-x;
}
nav.tabs::-webkit-scrollbar{display:none;}
nav.tabs button{
  font-family:var(--font-d);font-weight:600;font-size:15px;letter-spacing:0.5px;
  background:transparent;color:var(--metal);border:1px solid transparent;
  padding:10px 18px;border-radius:8px;white-space:nowrap;
  flex:0 0 auto;min-width:max-content;
  transition:color .15s, border-color .15s, background .15s;
}
nav.tabs button.active{color:var(--neon);border-color:var(--neon-dim);background:rgba(233,255,46,0.06);}
nav.tabs button:not(.active):hover{color:var(--white);background:var(--panel-2);}

main{flex:1;padding:16px;max-width:1180px;margin:0 auto;width:100%;}
main,.panel,.grid,.field{min-width:0;}
input,select,textarea{max-width:100%;min-width:0;}
@media (max-width:640px){main{padding:12px;}}

.panel{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:18px;}
.panel + .panel{margin-top:14px;}
.panel-title{font-family:var(--font-d);font-weight:700;font-size:16px;color:var(--white);margin:0 0 12px;letter-spacing:0.3px;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;}

.grid{display:grid;gap:12px;}
.grid-4{grid-template-columns:repeat(4,minmax(0,1fr));}
.grid-3{grid-template-columns:repeat(3,minmax(0,1fr));}
.grid-2{grid-template-columns:repeat(2,minmax(0,1fr));}
@media (max-width:860px){.grid-4{grid-template-columns:repeat(2,minmax(0,1fr));}.grid-3{grid-template-columns:repeat(2,minmax(0,1fr));}}
@media (max-width:520px){.grid-4,.grid-3,.grid-2{grid-template-columns:repeat(2,minmax(0,1fr));}}

.stat-box{background:var(--panel-2);border:1px solid var(--border-soft);border-radius:var(--radius-sm);padding:12px 14px;min-width:0;max-width:100%;overflow:hidden;}
.stat-box .label{font-size:12px;color:var(--metal);margin-bottom:4px;}
.stat-box .value{font-family:var(--font-d);font-weight:700;font-size:26px;color:var(--neon);}
.stat-box .value.small{font-size:18px;color:var(--white);min-width:0;max-width:100%;overflow-wrap:anywhere;word-break:break-word;}

.btn{
  font-family:var(--font-d);font-weight:600;font-size:14px;letter-spacing:0.3px;
  padding:11px 18px;border-radius:8px;border:1px solid var(--border);
  background:var(--panel-2);color:var(--white);
  min-height:44px;display:inline-flex;align-items:center;justify-content:center;gap:8px;
  transition:transform .08s, border-color .15s, background .15s;
}
.btn:active{transform:scale(0.97);}
.btn:hover{border-color:var(--metal-dim);}
.btn-primary{background:var(--neon);color:#0a0a0a;border-color:var(--neon);}
.btn-primary:hover{background:var(--neon-dim);border-color:var(--neon-dim);}
.btn-danger{background:transparent;color:var(--danger);border-color:var(--danger);}
.btn-danger:hover{background:var(--danger-glow);}
.btn-danger-solid{background:var(--danger);color:#fff;border-color:var(--danger);}
.btn-ghost{background:transparent;border-color:var(--border);color:var(--metal);}
.btn-ghost:hover{color:var(--white);}
.btn-block{width:100%;}
.btn-sm{padding:8px 12px;font-size:13px;min-height:38px;}
.btn:disabled{opacity:0.35;cursor:not-allowed;transform:none;}
.btn-row{display:flex;gap:10px;flex-wrap:wrap;}

.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px;}
.field label{font-size:13px;color:var(--metal);font-weight:500;}
.field input[type=text],.field input[type=date],.field input[type=time],.field input[type=number],.field select,.field textarea{
  background:var(--panel-2);border:1px solid var(--border);color:var(--white);
  border-radius:8px;padding:11px 12px;font-size:15px;min-height:44px;width:100%;
}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--neon-dim);}
.field textarea{min-height:180px;resize:vertical;font-family:var(--font-b);line-height:1.6;}
.hint{font-size:12px;color:var(--metal-dim);margin-top:2px;}
.warn-text{font-size:12px;color:var(--danger);margin-top:4px;}

.badge{display:inline-flex;align-items:center;font-size:12px;font-weight:600;padding:3px 10px;border-radius:12px;font-family:var(--font-d);}
.badge-neon{background:var(--neon-glow);color:var(--neon);border:1px solid var(--neon-dim);}
.badge-gold{background:rgba(199,162,80,.12);color:var(--gold);border:1px solid rgba(199,162,80,.42);}
.badge-danger{background:var(--danger-glow);color:var(--danger);border:1px solid var(--danger);}
.badge-metal{background:var(--panel-3);color:var(--metal);border:1px solid var(--border);}
.badge-ok{background:rgba(61,220,132,0.12);color:var(--ok);border:1px solid var(--ok);}

table.rank-table{width:100%;border-collapse:collapse;font-size:14px;}
table.rank-table th{text-align:left;color:var(--metal);font-weight:600;font-size:12px;padding:8px 8px;border-bottom:1px solid var(--border);white-space:nowrap;}
table.rank-table td{padding:9px 8px;border-bottom:1px solid var(--border-soft);white-space:nowrap;}
table.rank-table tr:last-child td{border-bottom:none;}
.rank-scroll{overflow-x:auto;max-height:420px;overflow-y:auto;}
.rank-name{color:var(--white);font-weight:600;}
.rank-num{font-family:var(--font-d);font-weight:700;color:var(--neon);}

.match-live-card{background:linear-gradient(135deg, rgba(255,59,59,0.08), rgba(233,255,46,0.04));border:1px solid var(--danger);border-radius:var(--radius);padding:16px;}
.match-live-card .top{display:flex;align-items:center;gap:8px;margin-bottom:10px;}
.match-live-card .vs{display:flex;align-items:center;justify-content:space-between;gap:12px;}
.match-live-card .p{font-family:var(--font-d);font-weight:700;font-size:20px;color:var(--white);}
.match-live-card .sc{font-family:var(--font-d);font-weight:700;font-size:32px;color:var(--neon);}
.match-live-card .mid{color:var(--metal);font-size:13px;}

.bracket-wrap{position:relative;z-index:1;overflow-x:auto;padding-bottom:8px;}
.event-title-bar{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;margin-bottom:12px;}
.event-title-center{display:flex;align-items:center;gap:10px;justify-self:center;min-width:0;max-width:100%;}
.event-title-name{font-family:var(--font-d);font-weight:700;font-size:16px;color:var(--white);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:46vw;letter-spacing:0.3px;}
.event-title-right{justify-self:end;display:flex;align-items:center;gap:8px;}
@media (max-width:640px){
  .event-title-bar{grid-template-columns:1fr;row-gap:8px;}
  .event-title-right{justify-self:start;order:-1;}
  .event-title-center{justify-self:center;}
  .event-title-name{max-width:62vw;}
}
.share-btn{
  position:relative;width:44px;height:44px;flex-shrink:0;border-radius:50%;
  background:rgba(10,10,11,0.72);border:1px solid var(--gold-dim);color:var(--gold);
  display:flex;align-items:center;justify-content:center;
  transition:box-shadow .15s, transform .08s, border-color .15s;
}
.share-btn:hover{border-color:var(--gold);box-shadow:0 0 0 4px var(--gold-glow);}
.share-btn:active{transform:scale(0.93);}
.share-btn:focus-visible{outline:2px solid var(--gold);outline-offset:2px;}
.share-btn svg{width:19px;height:19px;}
.checkin-btn-pending{background:rgba(10,10,11,0.6);border:1px solid var(--gold-dim);color:var(--gold);}
.checkin-btn-pending:hover{border-color:var(--gold);}
.checkin-btn-done{background:rgba(61,220,132,0.14);border:1px solid var(--ok);color:var(--ok);}
.checkin-btn-done:hover{background:rgba(61,220,132,0.22);}
.share-modal-box{max-width:440px;}
.share-modal-header{display:flex;align-items:center;gap:12px;}
.share-modal-logo{width:44px;height:44px;object-fit:contain;flex-shrink:0;}
.share-summary-box{margin-top:12px;background:var(--panel-2);border:1px solid var(--border);border-radius:8px;padding:12px 14px;font-size:13px;line-height:1.7;color:var(--white);white-space:normal;}
.share-target-tabs{display:flex;gap:8px;overflow-x:auto;padding:4px 0 8px;scrollbar-width:none;}
.share-target-tabs::-webkit-scrollbar{display:none;}
.share-target-tabs button{flex:0 0 auto;white-space:nowrap;}
.share-qr-box{width:236px;min-height:236px;margin:14px auto 8px;padding:10px;background:#fff;border-radius:12px;display:flex;align-items:center;justify-content:center;}
.share-qr-box img,.share-qr-box canvas{display:block;max-width:216px!important;max-height:216px!important;}
.qr-scanner-box{position:relative;overflow:hidden;border:1px solid var(--gold-dim);border-radius:12px;background:#000;aspect-ratio:1/1;margin-top:12px;}
.qr-scanner-video{width:100%;height:100%;object-fit:cover;display:block;}
.qr-scanner-frame{position:absolute;inset:14%;border:2px solid var(--gold);border-radius:12px;box-shadow:0 0 0 999px rgba(0,0,0,.32);pointer-events:none;}
.qr-scanner-line{position:absolute;left:17%;right:17%;top:50%;height:2px;background:var(--neon);box-shadow:0 0 10px var(--neon);animation:qrScanLine 1.8s ease-in-out infinite;pointer-events:none;}
@keyframes qrScanLine{0%,100%{transform:translateY(-90px);opacity:.45}50%{transform:translateY(90px);opacity:1}}
.bracket-wm-wrap{position:relative;isolation:isolate;min-width:0;}
.bracket-wm{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;z-index:0;overflow:hidden;}
.bracket-wm img{width:100%;height:100%;object-fit:contain;opacity:0.07;filter:saturate(0.5);}
.bracket-wm-content{position:relative;z-index:1;min-width:0;max-width:100%;}
.se-bracket-outer{position:relative;}
.se-bracket-svg{position:absolute;left:0;top:0;z-index:1;pointer-events:none;}
.se-bracket-cols{display:flex;gap:56px;min-width:max-content;padding:8px 4px;position:relative;z-index:2;}
.se-col{display:flex;flex-direction:column;min-width:220px;position:relative;}
.se-col-title{font-family:var(--font-d);font-weight:700;font-size:13px;color:var(--metal);text-align:center;margin-bottom:14px;letter-spacing:1px;}
.se-col[data-round="0"] .match-box{position:relative;margin-bottom:22px;}
.se-col[data-round="0"] .match-box:last-child{margin-bottom:0;}
.se-col:not([data-round="0"]) .match-box{position:absolute;left:0;right:0;top:0;}
.se-bronze-col{margin-top:0;}
.bracket-cols{display:flex;gap:34px;min-width:max-content;padding:8px 4px;}
.bracket-col{display:flex;flex-direction:column;justify-content:space-around;gap:18px;min-width:220px;}
.bracket-col-title{font-family:var(--font-d);font-weight:700;font-size:13px;color:var(--metal);text-align:center;margin-bottom:6px;letter-spacing:1px;}
.match-box{background:var(--panel-2);border:1px solid var(--border);border-radius:8px;overflow:hidden;cursor:pointer;transition:border-color .15s;}
.match-box:hover{border-color:var(--neon-dim);}
.match-box.done{border-color:var(--neon-dim);}
.match-box .mb-head{font-size:11px;color:var(--metal-dim);padding:5px 10px;background:var(--panel-3);display:flex;justify-content:space-between;}
.match-box .mb-row{display:flex;justify-content:space-between;align-items:center;padding:8px 10px;font-size:14px;border-top:1px solid var(--border-soft);}
.match-box .mb-row.winner{color:var(--neon);font-weight:700;}
.match-box .mb-row .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:130px;}
.match-box .mb-row .sc{font-family:var(--font-d);font-weight:700;}

/* ==== match status system (pending/ready/in_progress/completed/paused) ==== */
.match-box.ms-card-pending{border-color:#3a3d42;}
.match-box.ms-card-in_progress{
  border-color:#D4AF37;
  background:linear-gradient(160deg, rgba(212,175,55,0.06), var(--panel-2));
  box-shadow:0 0 0 1px rgba(212,175,55,0.25), 0 0 14px rgba(212,175,55,0.35);
  animation:ms-breathe-gold 1.8s ease-in-out infinite;
}
@keyframes ms-breathe-gold{
  0%,100%{ box-shadow:0 0 0 1px rgba(212,175,55,0.22), 0 0 10px rgba(212,175,55,0.22); border-color:#b8933f; }
  50%{ box-shadow:0 0 0 1.5px rgba(243,217,139,0.55), 0 0 22px rgba(212,175,55,0.55); border-color:#F3D98B; }
}
.match-box.ms-card-in_progress .mb-head{color:#D4AF37;}
.match-box.ms-card-in_progress .mb-row .sc{color:#F3D98B;font-size:16px;}

.match-box.ms-card-ready{
  border-color:#4CB8FF;
  background:linear-gradient(160deg, rgba(76,184,255,0.05), var(--panel-2));
  box-shadow:0 0 0 1px rgba(76,184,255,0.2), 0 0 12px rgba(76,184,255,0.3);
  animation:ms-breathe-ice 2.7s ease-in-out infinite;
}
@keyframes ms-breathe-ice{
  0%,100%{ box-shadow:0 0 0 1px rgba(76,184,255,0.18), 0 0 8px rgba(76,184,255,0.18); border-color:#3a92c9; }
  50%{ box-shadow:0 0 0 1.5px rgba(169,226,255,0.5), 0 0 18px rgba(76,184,255,0.4); border-color:#A9E2FF; }
}

.match-box.ms-card-completed{border-color:#6b6248;}
.match-box.ms-card-completed .mb-row.winner{color:#D4AF37;font-weight:700;}
.match-box.ms-card-completed .mb-row:not(.winner){opacity:0.55;}

.match-box.ms-card-paused{border-color:#8A6428;border-style:dashed;}

.match-status-bar{
  font-family:var(--font-d);font-size:11px;font-weight:600;
  padding:4px 10px;margin-top:6px;border-radius:4px;
  display:flex;align-items:center;gap:6px;
}
.ms-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0;background:currentColor;}
.match-status-bar.ms-bar-in_progress{color:#D4AF37;background:rgba(212,175,55,0.12);}
.match-status-bar.ms-bar-in_progress .ms-dot{animation:ms-dot-pulse 1.8s ease-in-out infinite;}
.match-status-bar.ms-bar-ready{color:#4CB8FF;background:rgba(15,30,45,0.55);}
.match-status-bar.ms-bar-ready .ms-dot{animation:ms-dot-pulse 2.7s ease-in-out infinite;}
.match-status-bar.ms-bar-completed{color:#8FAF72;background:rgba(143,175,114,0.08);}
.match-status-bar.ms-bar-pending{color:var(--metal-dim);background:rgba(255,255,255,0.03);}
.match-status-bar.ms-bar-paused{color:#c9a24d;background:rgba(138,100,40,0.12);}
@keyframes ms-dot-pulse{0%,100%{opacity:0.4;}50%{opacity:1;}}

.match-status-legend{
  display:flex;flex-wrap:wrap;gap:14px;
  padding:10px 4px 14px;font-size:12px;color:var(--metal);
}
.legend-item{display:flex;align-items:center;gap:6px;}
.legend-swatch{width:14px;height:14px;border-radius:3px;border:2px solid;flex-shrink:0;}
.legend-in_progress{border-color:#D4AF37;box-shadow:0 0 6px rgba(212,175,55,0.5);}
.legend-ready{border-color:#4CB8FF;box-shadow:0 0 6px rgba(76,184,255,0.4);}
.legend-completed{border-color:#6b6248;}
.legend-pending{border-color:#3a3d42;}

.match-status-controls{
  display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;
  margin-bottom:12px;padding:8px 12px;background:var(--panel-2);border-radius:8px;border:1px solid var(--border-soft);
}
.msc-label{font-size:12.5px;color:var(--metal);display:flex;align-items:center;gap:8px;}
.msc-btns{display:flex;gap:8px;flex-wrap:wrap;}
.ms-inline{display:inline-flex;align-items:center;gap:6px;font-weight:700;}
.ms-inline-in_progress{color:#D4AF37;}
.ms-inline-ready{color:#4CB8FF;}
.ms-inline-completed{color:#8FAF72;}
.ms-inline-pending{color:var(--metal-dim);}
.ms-inline-paused{color:#c9a24d;}
.ms-inline .ms-dot{animation-play-state:running;}
.ms-inline-in_progress .ms-dot{animation:ms-dot-pulse 1.8s ease-in-out infinite;}
.ms-inline-ready .ms-dot{animation:ms-dot-pulse 2.7s ease-in-out infinite;}

@media (prefers-reduced-motion: reduce){
  .match-box.ms-card-in_progress{animation:none; box-shadow:0 0 0 1.5px rgba(243,217,139,0.5), 0 0 16px rgba(212,175,55,0.4); border-color:#F3D98B;}
  .match-box.ms-card-ready{animation:none; box-shadow:0 0 0 1.5px rgba(169,226,255,0.45), 0 0 14px rgba(76,184,255,0.32); border-color:#A9E2FF;}
  .match-status-bar .ms-dot, .ms-inline .ms-dot{animation:none !important;}
}
@media (max-width:640px){
  .match-status-legend{gap:10px;font-size:11px;}
  .match-status-controls{flex-direction:column;align-items:stretch;}
}

/* ==== quick decision mode (簡易判定模式) ==== */
.qd-mode-title{font-family:var(--font-d);font-weight:700;font-size:18px;color:var(--gold);text-align:center;margin-top:6px;}
.qd-mode-sub{font-size:13px;color:var(--metal);text-align:center;margin-top:4px;margin-bottom:18px;}
.qd-cards{display:flex;gap:16px;}
.qd-card{
  flex:1;display:flex;flex-direction:column;align-items:center;text-align:center;
  padding:28px 18px;border-radius:12px;background:var(--panel-2);border:1px solid var(--border);
}
.qd-icon{width:44px;height:44px;color:var(--gold-dim);margin-bottom:10px;}
.qd-icon svg{width:100%;height:100%;}
.qd-name{font-family:var(--font-d);font-weight:700;font-size:22px;color:var(--white);word-break:break-word;}
.qd-meta{font-size:12.5px;color:var(--metal);margin-top:6px;margin-bottom:18px;}
.qd-choose-btn{
  width:100%;min-height:56px;border-radius:8px;border:1px solid var(--gold-dim);
  background:linear-gradient(180deg,var(--champagne-gold),var(--imperial-gold));color:#141208;
  font-family:var(--font-d);font-weight:700;font-size:15px;
}
.qd-choose-btn:disabled{opacity:0.4;background:var(--panel-3);color:var(--metal-dim);border-color:var(--border);}
.qd-win-tag{color:#D4AF37;font-weight:700;}
.qd-tag{
  display:inline-block;margin-left:8px;font-size:10px;font-weight:700;padding:1px 6px;border-radius:8px;
  background:rgba(212,175,55,0.15);color:#D4AF37;letter-spacing:0.5px;vertical-align:middle;
}
@media (max-width:640px){
  .qd-cards{flex-direction:column;}
}

.scoring-mode-cards{display:flex;gap:12px;margin-top:10px;}
.scoring-mode-card{
  flex:1;text-align:left;padding:14px 16px;border-radius:10px;
  background:var(--panel-2);border:1px solid var(--border);cursor:pointer;
}.scoring-mode-card.active{border-color:var(--gold);background:linear-gradient(160deg, rgba(217,185,92,0.1), var(--panel-2));}
.scoring-mode-card:disabled{opacity:0.5;cursor:not-allowed;}
.smc-title{font-family:var(--font-d);font-weight:700;font-size:14px;color:var(--white);}
.scoring-mode-card.active .smc-title{color:var(--gold);}
.smc-desc{font-size:12px;color:var(--metal);margin-top:4px;}
@media (max-width:640px){
  .scoring-mode-cards{flex-direction:column;}
}
.round-scoring-list{display:flex;flex-direction:column;gap:8px;margin-top:10px;}
.round-scoring-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:8px 10px;background:var(--panel-2);border-radius:8px;}
.rsr-label{font-size:13px;color:var(--white);min-width:80px;font-weight:600;}

/* ==== bracket view mode toggle + board (kiosk) mode ==== */
.bracket-view-toggle{display:flex;gap:8px;margin-bottom:14px;}
.bvt-btn{flex:1;max-width:220px;padding:9px 14px;border-radius:8px;border:1px solid var(--border);background:var(--panel-2);color:var(--metal);font-family:var(--font-d);font-weight:600;font-size:13px;}
.bvt-btn.active{border-color:var(--gold);color:var(--gold);background:linear-gradient(160deg, rgba(217,185,92,0.12), var(--panel-2));}
.single-bracket-layout-toggle{display:flex;gap:8px;flex-wrap:wrap;margin:-4px 0 14px;}
.single-bracket-layout-toggle .btn.active{border-color:var(--gold);color:var(--gold);background:rgba(217,185,92,0.1);}
.match-box.bye-placeholder{visibility:hidden;pointer-events:none;}
.compact-bracket{display:flex;flex-direction:column;gap:18px;}
.compact-round{border:1px solid var(--border);border-radius:12px;background:rgba(15,15,16,0.78);overflow:hidden;}
.compact-round-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px 14px;background:var(--panel-3);border-bottom:1px solid var(--border);}
.compact-round-title{font-family:var(--font-d);font-weight:700;color:var(--gold);font-size:14px;letter-spacing:.5px;}
.compact-round-count{font-size:11px;color:var(--metal-dim);white-space:nowrap;}
.compact-round-matches{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px;padding:12px;}
.compact-round .match-box{min-width:0;}
@media (max-width:640px){
  .single-bracket-layout-toggle{display:grid;grid-template-columns:1fr 1fr;}
  .single-bracket-layout-toggle .btn{width:100%;}
  .compact-bracket{gap:12px;}
  .compact-round-matches{grid-template-columns:1fr;padding:9px;}
  .compact-round-head{padding:10px 12px;position:sticky;top:0;z-index:2;}
}

.board-shell{
  --board-accent: #d9b95c;
  position:relative;border-radius:16px;overflow:hidden;
  background:linear-gradient(180deg, #0d0e0a 0%, #08090a 55%, #030303 100%);
  border:1px solid var(--board-accent);padding:18px;
  box-shadow:0 20px 50px rgba(0,0,0,0.5), inset 0 0 60px rgba(0,0,0,0.4);
}
.board-shell[data-board-theme="gold"]{ --board-accent:#d9b95c; }
.board-shell[data-board-theme="cyan"]{ --board-accent:#2ee6d6; }
.board-shell[data-board-theme="violet"]{ --board-accent:#b48cff; }
.board-shell[data-board-theme="amber"]{ --board-accent:#f0a94e; }
.board-shell[data-board-theme="red"]{ --board-accent:#ef5b5b; }
.board-shell[data-board-theme="rose"]{ --board-accent:#f082b0; }
.board-shell[data-board-theme="ice"]{ --board-accent:#5fc4ff; }
.board-wm{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;overflow:hidden;z-index:0;}
.board-wm img{width:55%;max-width:520px;opacity:0.05;}
.board-header{position:relative;z-index:1;display:flex;align-items:center;justify-content:space-between;gap:14px;padding-bottom:14px;border-bottom:1px solid var(--board-accent);margin-bottom:14px;}
.board-header-left{display:flex;align-items:center;gap:12px;}
.board-logo{height:44px;width:auto;}
.board-title{font-family:var(--font-d);font-weight:700;font-size:16px;color:var(--board-accent);letter-spacing:1px;}
.board-sub{font-size:12px;color:var(--metal);margin-top:2px;}
.board-status-chip{padding:2px 8px;border-radius:10px;font-weight:700;font-size:11px;}
.board-status-chip.status-waiting{color:var(--metal);background:rgba(255,255,255,0.05);}
.board-status-chip.status-live{color:var(--danger);background:rgba(255,59,59,0.12);}
.board-status-chip.status-done{color:#8FAF72;background:rgba(143,175,114,0.12);}

.board-toolbar{position:relative;z-index:1;display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-bottom:6px;}
.board-toolbar .btn{color:var(--white);}
.board-toolbar .btn:hover{border-color:var(--board-accent);}
.board-zoom-group{display:flex;align-items:center;gap:6px;padding:2px 4px;border:1px solid var(--border);border-radius:8px;}
.board-zoom-group .btn{padding:4px 8px;min-height:0;}
.board-zoom-pct{font-family:var(--font-d);font-weight:700;font-size:12.5px;color:var(--board-accent);min-width:42px;text-align:center;}
.board-theme-select{background:var(--panel-2);color:var(--white);border:1px solid var(--border);border-radius:8px;padding:6px 10px;font-size:12.5px;}

.board-viewport{
  position:relative;z-index:1;overflow:hidden;border-radius:10px;
  background:rgba(0,0,0,0.25);border:1px solid var(--border-soft);
  height:min(70vh,760px);cursor:grab;touch-action:none;
}
.board-canvas{
  transform-origin:0 0;padding:24px;width:max-content;min-width:100%;
  transition:transform .05s linear;
}
.board-champion-area{
  margin-top:26px;padding:22px;border-radius:12px;text-align:center;
  background:linear-gradient(160deg, rgba(217,185,92,0.08), rgba(0,0,0,0.2));
  border:1px solid var(--board-accent);width:220px;
}
.board-trophy{display:inline-block;width:52px;height:52px;color:var(--board-accent);}
.board-trophy svg{width:100%;height:100%;}
.board-champion-label{font-family:var(--font-d);font-weight:700;font-size:12px;letter-spacing:3px;color:var(--board-accent);margin-top:6px;}
.board-champion-name{font-family:var(--font-d);font-weight:700;font-size:22px;margin-top:6px;
  background:linear-gradient(180deg,#FFF0A6,var(--board-accent));-webkit-background-clip:text;background-clip:text;color:transparent;
}
.board-champion-name.pending{color:var(--metal-dim);background:none;-webkit-background-clip:initial;}

.board-footer{position:relative;z-index:1;display:flex;justify-content:flex-end;margin-top:10px;}
.board-code{font-family:var(--font-d);font-size:11px;color:var(--metal-dim);letter-spacing:1px;}

.board-canvas .se-bronze-col .match-box,
.board-canvas .bracket-col.se-bronze-col{border-color:#B87333;}
.board-canvas .se-bronze-col .bracket-col-title{color:#B87333;}

.board-export-freeze .match-box.ms-card-in_progress,
.board-export-freeze .match-box.ms-card-ready{animation:none !important;}
.board-export-freeze .ms-dot{animation:none !important;}

@media (max-width:640px){
  .board-shell{padding:12px;}
  .board-header{flex-direction:column;align-items:flex-start;gap:10px;}
  .board-toolbar{gap:6px;}
  .board-viewport{height:60vh;}
  .board-logo{height:34px;}
}

/* ==== version update page ==== */
.version-page{max-width:760px;margin:0 auto;}
.version-hero{
  position:relative;overflow:hidden;text-align:center;padding:28px 20px;border-radius:14px;margin-top:10px;
  background:linear-gradient(160deg, rgba(217,185,92,0.12), rgba(0,0,0,0.3));
  border:1px solid var(--gold);
}
.version-hero-badge{
  display:inline-block;font-family:var(--font-d);font-weight:700;font-size:32px;
  background:linear-gradient(180deg,#FFF0A6,var(--gold),var(--gold-dim));
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
.version-hero-internal{font-size:12px;color:var(--metal);margin-top:2px;font-family:var(--font-d);letter-spacing:1px;}
.version-hero-title{font-family:var(--font-d);font-weight:700;font-size:18px;color:var(--white);margin-top:14px;}
.version-hero-meta{font-size:12px;color:var(--metal);margin-top:6px;}
.version-level-chip{

.version-level-chip.level-major{color:#ff8b8b;background:rgba(255,59,59,0.14);}
.version-level-chip.level-minor{color:var(--gold);background:rgba(217,185,92,0.14);}
.version-level-chip.level-patch{color:#8FAF72;background:rgba(143,175,114,0.14);}
.version-level-chip.level-baseline{color:var(--metal);background:rgba(255,255,255,0.06);}
.version-timeline{display:flex;flex-direction:column;gap:10px;margin-top:10px;}
.version-timeline-item{
  padding:14px 16px;border-radius:10px;background:var(--panel-2);border:1px solid var(--border-soft);
  border-left:3px solid var(--border);
}
.version-timeline-item.is-latest{border-left-color:var(--gold);background:linear-gradient(160deg, rgba(217,185,92,0.06), var(--panel-2));}
.vti-top{display:flex;align-items:center;justify-content:space-between;gap:10px;}
.vti-version{font-family:var(--font-d);font-weight:700;font-size:14px;color:var(--white);}

.ref-scorecard{display:grid;grid-template-columns:1fr 1fr;gap:14px;}

/* ---------- multi-court referee grid (dynamic, never hardcoded to N) ---------- */
.court-grid{display:grid;gap:18px;}
.court-grid > .court-card + .court-card{margin-top:0;}
.court-grid-1{grid-template-columns:minmax(0,760px);justify-content:center;}
.court-grid-2,.court-grid-many{grid-template-columns:repeat(2,minmax(0,1fr));}
/* Multiple referee windows are always ordered left→right, then top→bottom: 1 2 / 3 4 / 5 6 ... */
.court-card{
  scroll-margin-top:70px;
  align-self:stretch;
  box-sizing:border-box;
  position:relative;
  overflow:hidden;
  border-color:var(--court-accent,var(--border));
  box-shadow:
    0 0 0 1px var(--court-glow-soft,transparent),
    0 0 24px var(--court-glow,transparent),
    inset 0 1px 0 var(--court-glow-soft,transparent);
}
.court-card::before{
  content:"";
  position:absolute;inset:0 0 auto 0;height:5px;
  background:var(--court-accent,var(--gold));
  box-shadow:0 0 18px var(--court-accent,var(--gold)),0 0 34px var(--court-glow,transparent);
  pointer-events:none;
}
.court-card::after{
  content:"";
  position:absolute;inset:0;
  background:radial-gradient(circle at 50% 0%,var(--court-glow-soft,transparent),transparent 44%);
  pointer-events:none;z-index:0;
}
.court-card > *{position:relative;z-index:1;}
.court-card-header{display:flex;align-items:center;gap:10px;margin-bottom:4px;padding-top:4px;}
.court-badge{
  background:var(--court-accent,var(--gold));color:#090a0b;font-family:var(--font-d);font-weight:900;
  font-size:13px;padding:4px 12px;border-radius:8px;letter-spacing:1px;flex-shrink:0;
  box-shadow:0 0 14px var(--court-glow,transparent);
}
.court-next-preview{font-size:12px;color:var(--metal-dim);margin-bottom:10px;}
.court-jump-nav{
  display:none;gap:6px;overflow-x:auto;padding:8px 4px;margin-bottom:10px;
  position:sticky;top:0;z-index:20;background:var(--bg);
}
.court-jump-btn{
  flex-shrink:0;background:var(--panel-2);border:1px solid var(--court-accent,var(--border-soft));color:var(--court-accent,var(--metal));
  padding:6px 14px;border-radius:8px;font-size:12.5px;font-weight:800;min-height:36px;
  box-shadow:0 0 10px var(--court-glow,transparent);
}

/* Four-court referee mode: preserve every control; the page may scroll instead of clipping. */
@media (min-width:900px){
  .court-grid-4fit{
    grid-template-columns:repeat(2,minmax(0,1fr));

    gap:10px;
    overflow:visible;
  }
  .court-grid-4fit .court-card{

    async settleTestLadderTournament(code,payload){

      if(tournament.testMode!==true||tournament.eventAuthority!=="test"||tournament.ownerUid!==actorUid) return {ok:false,reason:"not-own-test-event",message:"只能結算自己建立的測試賽事"};
      const items=(payload&&payload.participants||[]).filter(x=>x&&x.source==="test"&&/^T\d{3}$/.test(String(x.testPlayerKey||"")));
      if(!items.length) return {ok:true,skipped:true,reason:"no-test-players",message:"本場皆為現場新增選手，未計入 TEST-S1；僅 T001～T064 實驗玩家可累積測試積分",results:[],skippedPlayers:(payload?.participants||[]).map(p=>p.playerName)};
      const results=[]; let newWrites=0;

        const txId=eventCode+"_"+key;
        const txRef=fx.doc(dbHandle,"testLadderTransactions",txId);
        const playerRef=fx.doc(dbHandle,"testLadderPlayers",key);
        const r=await fx.runTransaction(dbHandle,async tx=>{
          const prior=await tx.get(txRef);
          if(prior.exists()) return {already:true,points:Number(prior.data().delta||0)};
          const ps=await tx.get(playerRef);
          const old=ps.exists()?ps.data():{};
          const delta=Number(item.pointsEarned||0);
          const next={
            testPlayerKey:key, playerName:String(item.playerName||key), seasonId:"TEST-S1",
            seasonPoints:Number(old.seasonPoints||0)+delta, careerPoints:Number(old.careerPoints||0)+delta,
            totalEvents:Number(old.totalEvents||0)+1, wins:Number(old.wins||0)+Number(item.wins||0), losses:Number(old.losses||0)+Number(item.losses||0),
            championCount:Number(old.championCount||0)+(item.placement===1?1:0), runnerUpCount:Number(old.runnerUpCount||0)+(item.placement===2?1:0),
            thirdPlaceCount:Number(old.thirdPlaceCount||0)+(item.placement===3?1:0), fourthPlaceCount:Number(old.fourthPlaceCount||0)+(item.placement===4?1:0),
            updatedAt:Date.now()
          };
          tx.set(playerRef,next,{merge:true});
          tx.set(txRef,{type:"event",eventAuthority:"test",actorUid,testPlayerKey:key,playerName:String(item.playerName||key),seasonId:"TEST-S1",delta,eventCode,eventName:String(payload.eventName||""),placement:item.placement||null,wins:Number(item.wins||0),losses:Number(item.losses||0),createdAt:Date.now()});
          return {already:false,points:delta};
        });
        if(!r.already) newWrites++;
        results.push({testPlayerKey:key,playerName:item.playerName,pointsEarned:r.points,placement:item.placement||null,alreadyAwarded:!!r.already});
      }
      return {ok:true,seasonId:"TEST-S1",awardedAt:Date.now(),alreadyAwarded:newWrites===0,results};
    },

    async settleLadderTournament(code,payload){
      if(!cloudEnabled||!code) return {ok:false,reason:"network"};
      const actorUid=authHandle&&authHandle.currentUser&&authHandle.currentUser.uid;
      if(!actorUid) return {ok:false,reason:"auth-required"};

      // Resolve tournament-local players to permanent BXH account UIDs.
      // Online roster entries already carry uid. On-site names are accepted only
      // when an exact realName query resolves to exactly one active account.
      const resolved=[]; const skipped=[]; const cancelled=[];
      for(const item of (payload.participants||[])){
        // Explicit test players are never written into the official ladder.
        if(item.source==="family"||item.source==="test"||item.isTestData===true){
          skipped.push(item.playerName);
          continue;
        }

        let uid=item.playerUid||null;
        if(!uid){
          try{
            const q=fx.query(fx.collection(dbHandle,"users"),fx.where("realName","==",item.playerName),fx.limit(2));
            const s=await fx.getDocs(q);
            const candidates=s.docs.filter(d=>d.data()&&d.data().active===true);
            if(candidates.length===1) uid=candidates[0].id;
          }catch(e){ /* unresolved onsite player is skipped below */ }
        }

        // Manually-added / onsite players that cannot be linked to exactly one
        // BXH player account are skipped instead of blocking the whole event.
        if(!uid){
          skipped.push(item.playerName);
          continue;
        }

        // Online players stay strict. A cancelled / non-confirmed registration
        // means the official roster is inconsistent and must be fixed first.
        if(item.source==="online"){
          try{
            const rs=await fx.getDoc(fx.doc(dbHandle,"tournaments",String(code).toUpperCase(),"registrations",uid));
            if(!rs.exists() || rs.data().status!=="confirmed"){ cancelled.push(item.playerName); continue; }
          }catch(e){ cancelled.push(item.playerName); continue; }
        }
        resolved.push(Object.assign({},item,{playerUid:uid}));
      }
      if(cancelled.length) return {ok:false,reason:"cancelled-players",unlinkedPlayers:cancelled,message:"名單中含已取消或非正取玩家，請先修正參賽名單："+cancelled.join("、")};
      const seen=new Set();
      for(const x of resolved){ if(seen.has(x.playerUid)) return {ok:false,reason:"duplicate-player-account",message:"同一玩家帳號在本場名單中出現超過一次"}; seen.add(x.playerUid); }

      const tourRef=fx.doc(dbHandle,"tournaments",String(code).toUpperCase());
      const controlRef=fx.doc(dbHandle,"ladderSystem","current");
      return await fx.runTransaction(dbHandle,async tx=>{
        const tourSnap=await tx.get(tourRef);
        const controlSnap=await tx.get(controlRef);
        if(!tourSnap.exists()) return {ok:false,reason:"not-found"};
        const tour=tourSnap.data();
        if(tour.systemClosed===true) return {ok:false,reason:"system-closed",message:"系統關閉的賽事不能結算積分"};
        if(tour.ladderPointsAwarded===true) return {ok:true,alreadyAwarded:true,seasonId:tour.ladderSeasonId||null,results:tour.ladderResults||[],skippedPlayers:tour.ladderSkippedPlayers||[]};
        if(tour.testMode===true||tour.eventAuthority!=="official"||tour.ladderMode!=="ranked") return {ok:false,reason:"not-ranked"};
        if(!controlSnap.exists()) return {ok:false,reason:"season-not-initialized"};
        const control=controlSnap.data();
        if(control.rolloverInProgress===true) return {ok:false,reason:"season-rollover-in-progress",message:"賽季切換進行中，請稍後再完成賽事"};
        const seasonId=control.currentSeason||"S1";

        const refs=resolved.map(x=>fx.doc(dbHandle,"ladderPlayers",x.playerUid));
        const snaps=[]; for(const ref of refs) snaps.push(await tx.get(ref));
        const profiles=[];for(const item of resolved)profiles.push(await tx.get(fx.doc(dbHandle,"users",item.playerUid)));
        const results=[];
        for(let i=0;i<resolved.length;i++){
          const item=resolved[i], snap=snaps[i], old=snap.exists()?snap.data():{};
          const profile=profiles[i].exists()?profiles[i].data():null;
          if(!profile||profile.role==="tester"||profile.isTestAccount===true){if(!skipped.includes(item.playerName))skipped.push(item.playerName);continue;}
          if(old.currentSeason && old.currentSeason!==seasonId) return {ok:false,reason:"player-season-mismatch",message:"玩家賽季資料尚未完成切換，請先完成新賽季作業"};
          const oldSeason=Number(old.seasonPoints||0), oldCareer=Number(old.careerPoints||0);
          const pts=Number(item.pointsEarned||0);
          const seasonPoints=oldSeason+pts, careerPoints=oldCareer+pts;
          const rankTier=cloudLadderTier(seasonPoints);
          const oldHigh=old.highestRankTier||"黑鐵";
          const highestRankTier=cloudLadderTierIndex(rankTier)>cloudLadderTierIndex(oldHigh)?rankTier:oldHigh;
          const placement=Number(item.placement||0)||null;
          const data={
            uid:item.playerUid, playerName:item.playerName||old.playerName||"",
            seasonPoints,careerPoints,rankTier,currentSeason:seasonId,highestRankTier,
            totalEvents:Number(old.totalEvents||0)+1,
            championCount:Number(old.championCount||0)+(placement===1?1:0),
            runnerUpCount:Number(old.runnerUpCount||0)+(placement===2?1:0),
            thirdPlaceCount:Number(old.thirdPlaceCount||0)+(placement===3?1:0),
            fourthPlaceCount:Number(old.fourthPlaceCount||0)+(placement===4?1:0),
            rankedWins:Number(old.rankedWins||0)+Number(item.wins||0),
            rankedLosses:Number(old.rankedLosses||0)+Number(item.losses||0),
            lastPointsUpdatedAt:fx.serverTimestamp(),
            seasonHistory:old.seasonHistory||{}
          };
          tx.set(refs[i],data,{merge:true});
          const logRef=fx.doc(dbHandle,"ladderTransactions",String(code).toUpperCase()+"_"+item.playerUid);
          tx.set(logRef,{type:"event",eventCode:String(code).toUpperCase(),eventName:payload.eventName||tour.name||"",eventDate:payload.eventDate||tour.eventDate||"",formatType:payload.formatType||tour.formatType||"single",playerUid:item.playerUid,playerName:item.playerName||"",placement,wins:Number(item.wins||0),losses:Number(item.losses||0),pointsEarned:pts,delta:pts,seasonId,beforeSeasonPoints:oldSeason,afterSeasonPoints:seasonPoints,beforeCareerPoints:oldCareer,afterCareerPoints:careerPoints,actorUid,actorName:"",createdAt:fx.serverTimestamp()});
          results.push({playerId:item.playerUid,playerName:item.playerName||"",placement,pointsEarned:pts});
        }
        tx.update(tourRef,{
          ladderPointsAwarded:true,
          ladderSeasonId:seasonId,
          ladderResults:results,
          ladderSkippedPlayers:skipped,
          ladderAwardedAt:fx.serverTimestamp(),
          ladderAwardedBy:actorUid
        });
        return {ok:true,alreadyAwarded:false,seasonId,results,skippedPlayers:skipped,awardedAt:Date.now()};
      });
    },

    async adjustLadderPoints(uid,newSeasonPoints,reason,actorName){
      if(!cloudEnabled||!uid||!reason) return {ok:false,reason:"invalid"};
      const actorUid=authHandle&&authHandle.currentUser&&authHandle.currentUser.uid;
      if(!actorUid) return {ok:false,reason:"auth-required"};
      const playerRef=fx.doc(dbHandle,"ladderPlayers",uid);
      const controlRef=fx.doc(dbHandle,"ladderSystem","current");
      const logRef=fx.doc(fx.collection(dbHandle,"ladderTransactions"));
      return await fx.runTransaction(dbHandle,async tx=>{
        const ps=await tx.get(playerRef), cs=await tx.get(controlRef);
        if(!ps.exists()) return {ok:false,reason:"not-found"};
        if(!cs.exists()||cs.data().rolloverInProgress===true) return {ok:false,reason:"season-unavailable"};
        const old=ps.data(); const before=Math.max(0,Number(old.seasonPoints||0)); const after=Math.max(0,Number(newSeasonPoints)||0); const delta=after-before;
        const beforeCareer=Math.max(0,Number(old.careerPoints||0)); const afterCareer=Math.max(0,beforeCareer+delta);
        const rankTier=cloudLadderTier(after); const oldHigh=old.highestRankTier||"黑鐵"; const highest=cloudLadderTierIndex(rankTier)>cloudLadderTierIndex(oldHigh)?rankTier:oldHigh;
        tx.update(playerRef,{seasonPoints:after,careerPoints:afterCareer,rankTier,highestRankTier:highest,lastPointsUpdatedAt:fx.serverTimestamp()});
        tx.set(logRef,{type:"adjustment",playerUid:uid,playerName:old.playerName||"",seasonId:old.currentSeason||cs.data().currentSeason||"S1",beforeSeasonPoints:before,afterSeasonPoints:after,beforeCareerPoints:beforeCareer,afterCareerPoints:afterCareer,delta,reason,actorUid,actorName:actorName||"",createdAt:fx.serverTimestamp()});
        return {ok:true,before,after,delta};
      });
    },

    async openNewLadderSeason(actorName){
      if(!cloudEnabled) return {ok:false,reason:"network"};
      const actorUid=authHandle&&authHandle.currentUser&&authHandle.currentUser.uid;
      if(!actorUid) return {ok:false,reason:"auth-required"};
      const controlRef=fx.doc(dbHandle,"ladderSystem","current");

      // Lock the ladder first. Event settlement checks this flag inside its own transaction.
      const lock=await fx.runTransaction(dbHandle,async tx=>{        const cs=await tx.get(controlRef); if(!cs.exists()) return {ok:false,reason:"not-initialized"};
        const c=cs.data();
        if(c.rolloverInProgress!==true && c.lastRolloverCompletedAtMs && (Date.now()-Number(c.lastRolloverCompletedAtMs)) < 10*60*1000){
          return {ok:true,alreadyCompleted:true,oldSeason:c.lastRolloverFromSeason||null,newSeason:c.currentSeason||"S1"};
        }
        const oldSeason=c.rolloverFromSeason||(c.currentSeason||"S1");
        const newSeason=c.rolloverTargetSeason||cloudNextSeasonId(oldSeason);
        if(c.rolloverInProgress!==true){ tx.update(controlRef,{rolloverInProgress:true,rolloverFromSeason:oldSeason,rolloverTargetSeason:newSeason,updatedAt:fx.serverTimestamp()}); }
        return {ok:true,oldSeason,newSeason};
      });
      if(!lock.ok) return lock;
      if(lock.alreadyCompleted) return {ok:true,alreadyCompleted:true,oldSeason:lock.oldSeason,newSeason:lock.newSeason};

      const ps=await fx.getDocs(fx.collection(dbHandle,"ladderPlayers"));
      const players=ps.docs.map(d=>Object.assign({uid:d.id},d.data()));
      // On retry, players already rolled use their saved old-season final values.
      const finalRows=players.map(p=>{
        const h=p.seasonHistory&&p.seasonHistory[lock.oldSeason];
        return Object.assign({},p,{__finalPoints:h&&h.finalPoints!=null?Number(h.finalPoints):Number(p.seasonPoints||0)});
      }).sort((a,b)=> (b.__finalPoints-a.__finalPoints) || (Number(b.championCount||0)-Number(a.championCount||0)) || (Number(b.runnerUpCount||0)-Number(a.runnerUpCount||0)) || (Number(b.thirdPlaceCount||0)-Number(a.thirdPlaceCount||0)) || (Number(b.fourthPlaceCount||0)-Number(a.fourthPlaceCount||0)) || (Number(b.careerPoints||0)-Number(a.careerPoints||0)) );
      let lastKey=null,lastRank=0;
      finalRows.forEach((p,i)=>{const k=[p.__finalPoints,p.championCount||0,p.runnerUpCount||0,p.thirdPlaceCount||0,p.fourthPlaceCount||0,p.careerPoints||0].join("|"); if(i===0||k!==lastKey)lastRank=i+1; p.__finalRanking=lastRank; lastKey=k;});
      const byUid=Object.fromEntries(finalRows.map(x=>[x.uid,x]));

      const pending=players.filter(p=>p.lastRolloverFromSeason!==lock.oldSeason);
      for(let offset=0;offset<pending.length;offset+=350){
        const batch=fx.writeBatch(dbHandle);
        for(const p of pending.slice(offset,offset+350)){
          const final=byUid[p.uid]; const finalPoints=Number(final.__finalPoints||0); const history=Object.assign({},p.seasonHistory||{});
          history[lock.oldSeason]={finalPoints,finalRankTier:cloudLadderTier(finalPoints),finalRanking:final.__finalRanking};
          const newPoints=Math.floor(finalPoints*0.5); const newTier=cloudLadderTier(newPoints);
          batch.set(fx.doc(dbHandle,"ladderPlayers",p.uid),{seasonHistory:history,seasonPoints:newPoints,rankTier:newTier,currentSeason:lock.newSeason,lastRolloverFromSeason:lock.oldSeason,lastPointsUpdatedAt:fx.serverTimestamp()},{merge:true});
        }
        await batch.commit();
      }

      const now=Date.now(),endAt=cloudLadderSeasonEnd(now);
      const finishBatch=fx.writeBatch(dbHandle);
      finishBatch.set(fx.doc(dbHandle,"ladderSeasons",lock.oldSeason),{status:"completed",completedAt:fx.serverTimestamp(),completedBy:actorUid,finalPlayerCount:players.length},{merge:true});
      finishBatch.set(fx.doc(dbHandle,"ladderSeasons",lock.newSeason),{seasonId:lock.newSeason,startAt:now,endAt,status:"active",createdAt:fx.serverTimestamp(),createdBy:actorUid});
      finishBatch.set(controlRef,{currentSeason:lock.newSeason,startAt:now,endAt,status:"active",rolloverInProgress:false,rolloverFromSeason:null,rolloverTargetSeason:null,lastRolloverFromSeason:lock.oldSeason,lastRolloverToSeason:lock.newSeason,lastRolloverCompletedAtMs:now,updatedAt:fx.serverTimestamp()},{merge:true});
      await finishBatch.commit();
      return {ok:true,oldSeason:lock.oldSeason,newSeason:lock.newSeason,startAt:now,endAt};
    },

    // v13.14.4：刪除整場雲端賽事。Firestore 刪除父文件不會自動刪除子集合，
    // 因此先清 registrations / participants，再刪公開鏡像與主賽事文件。
    async deleteTournament(code){
      if(!cloudEnabled || !code) throw new Error("cloud-unavailable");
      const normalized = String(code).toUpperCase();
      const tourRef = fx.doc(dbHandle, "tournaments", normalized);
      const pubRef = fx.doc(dbHandle, "publicTournaments", normalized);
      const actorUid=currentUserUidForWrites();
      const selectionSnap=await fx.getDoc(tourRef);if(selectionSnap.exists()&&selectionSnap.data().registrationSelection){await window.engagementService.manageRegistrationSelection({code:normalized,action:"delete",operationId:crypto.randomUUID()});return true;}
      if(userProfile&&(userProfile.role==="tester"||userProfile.isTestAccount===true)){
        const ownSnap=await fx.getDoc(tourRef);
        const d=ownSnap.exists()?ownSnap.data():null;
        if(!d||d.testMode!==true||d.eventAuthority!=="test"||d.createdBy!==actorUid||d.ownerUid!==actorUid) throw new Error("permission-denied");
      }
      for(const sub of ["registrations","participants"]){
        const snap = await fx.getDocs(fx.collection(dbHandle, "tournaments", normalized, sub));
        for(const d of snap.docs){
          try{ await fx.deleteDoc(d.ref); }
          catch(e){ console.warn("[deleteTournament] subcollection delete failed", sub, d.id, e); throw e; }
        }
      }
      try{ await fx.deleteDoc(pubRef); }
      catch(e){ console.warn("[deleteTournament] public mirror delete failed", normalized, e); throw e; }
      try{ await fx.deleteDoc(tourRef); }
      catch(e){ console.warn("[deleteTournament] tournament delete failed", normalized, e); throw e; }
      return true;
    },

      // v13.14.2：補齊賽事建立者名稱。新版賽事會直接保存 createdByName；
      // 舊版賽事若只有 createdBy UID，admin / super_admin 會嘗試從 users/{uid}
      // 補查顯示名稱。staff 若無 users 讀取權限則安全退回顯示 UID，不影響清單載入。
      const creatorIds = [...new Set(items.map(x=>x.createdBy).filter(Boolean))];
      const creatorNameMap = {};
      await Promise.all(creatorIds.map(async uid=>{
        try{
          const userSnap = await fx.getDoc(fx.doc(dbHandle, "users", uid));
          if(userSnap.exists()){
            const u = userSnap.data() || {};
            creatorNameMap[uid] = u.displayName || u.realName || u.nickname || "";
          }
        }catch(e){ /* staff 可能無 users 讀取權限；保留 UID 即可 */ }
      }));
      items.forEach(x=>{
        if(!x.createdByName && x.createdBy && creatorNameMap[x.createdBy]) x.createdByName = creatorNameMap[x.createdBy];
      });
      return items.sort((a,b)=>{
        const ad = String(a.eventDate||""), bd = String(b.eventDate||"");
        if(ad!==bd) return ad<bd ? 1 : -1;
        return Number(b.updatedAt||0)-Number(a.updatedAt||0);
      });
    },

    // v13.13.4：玩家「已報名」改為「先列出公開賽事，再逐場 get 自己的 registration」。
    // 原本使用 collectionGroup('registrations') + where(uid==currentUid)，在正式 Firestore
    // 環境可能因 collection-group 索引/Rules 查詢可證明性而直接拋出 failed-precondition
    // 或 permission-denied，導致玩家明明已成功報名，這個分頁卻只顯示未知錯誤。
    // 現在不需要 collection-group index；每筆 registration 仍只 get 自己 uid 的文件，
    // 因此沿用既有 Security Rules 的本人讀取限制，不會讀到其他玩家資料。
    async queryMyRegistrations(){
      const uid = (authReady && authHandle && authHandle.currentUser) ? authHandle.currentUser.uid : null;
      if(!uid) return [];

      const q = fx.query(
        fx.collection(dbHandle, "publicTournaments"),
        fx.where("visibility", "==", "public")
      );
      const tourSnap = await fx.getDocs(q);
      const codes = [];
      tourSnap.forEach(docSnap => codes.push(docSnap.id));
      if(codes.length===0) return [];

      const reads = await Promise.all(codes.map(async code=>{
        try{
          const family=await window.engagementService.familyRegistration({action:'mine',code});
          if(family?.ok&&Array.isArray(family.rows)&&family.rows.length)return family.rows.map(x=>Object.assign({tournamentCode:code},x));
        }catch(e){ /* fallback to legacy guardian document below */ }
        try{
          const regSnap = await fx.getDoc(fx.doc(dbHandle, "tournaments", code, "registrations", uid));
          if(!regSnap.exists()) return null;
          return Object.assign({ tournamentCode: code }, regSnap.data());
        }catch(e){
          // 一場讀取失敗不應讓整個「已報名」頁崩潰；但權限/連線類錯誤仍保留診斷資訊。
          console.warn("[queryMyRegistrations] registration read failed", code, e);
          return null;
        }
      }));

      return reads.flatMap(x=>Array.isArray(x)?x:x?[x]:[]).filter(Boolean).sort((a,b)=>{
        const ta = a.createdAt && typeof a.createdAt.toMillis==="function" ? a.createdAt.toMillis() : 0;
        const tb = b.createdAt && typeof b.createdAt.toMillis==="function" ? b.createdAt.toMillis() : 0;
        return tb-ta;
      });
    },

    // Real round-trip diagnostic: writes a small test document, reads it back,
    // deletes it, and reports exactly what happened at each stage (with the
    // raw Firebase error message if something fails) so this can be trusted
    // as ground truth rather than a guess.
    async testConnection(){
      const result = { configured:false, sdkLoaded:false, readOk:false, permissionLimited:false, latencyMs:null, error:null, projectId:FIREBASE_CONFIG.projectId||null, role:null };
      result.configured = isConfigPresent();
      if(!result.configured){ result.error = "尚未在 FIREBASE_CONFIG 填入設定值"; return result; }
      const t0 = Date.now();
      const ok = await tryInitFirebase();
      result.sdkLoaded = ok && cloudEnabled;
      if(!result.sdkLoaded){
        result.error = "Firebase SDK 初始化失敗（可能是網路被阻擋、專案設定錯誤，或此環境不允許對外連線）";
        return result;
      }
      try{
        const uid = (authReady && authHandle && authHandle.currentUser) ? authHandle.currentUser.uid : null;
        if(!uid) throw { code:"unauthenticated", message:"尚未登入 Firebase 帳號" };
        const snap = await fx.getDoc(fx.doc(dbHandle,"users",uid));
        result.readOk = snap.exists();
        if(snap.exists()){
          const d=snap.data()||{};
          result.role=d.role||null;
          result.permissionLimited = d.role==="staff";
        }
        result.latencyMs = Date.now()-t0;
      }catch(e){
        result.error = (e&&e.code) ? (e.code+"："+(e.message||"")) : String(e);
        result.latencyMs = Date.now()-t0;
      }
      return result;
    },

          refereeStationNames: (m.refereeStationNames && typeof m.refereeStationNames==="object") ? m.refereeStationNames : {},
          refereeStationUids: (()=>{ const out=[]; Object.values((m.refereeStationAssignments&&typeof m.refereeStationAssignments==="object")?m.refereeStationAssignments:{}).forEach(list=>{ if(Array.isArray(list)) list.forEach(uid=>{ if(uid&&!out.includes(uid)) out.push(uid); }); }); return out; })(),
          refereeStationRestrictionEnabled: !!m.refereeStationRestrictionEnabled,

        }:{};
        // publicRegistrationFields: the SAME fields, minus assignedStaffUids —

    // Admin/staff use only — reads the FULL tournament document (includes
    // registrations with partial phone numbers etc). Guests must use
    // joinRoomPublic() instead, which the new Security Rules also enforce
    // server-side regardless of which function the client calls.
    // Returns a STRUCTURED result so the caller can show the right message
    // per spec section 5: {ok:true, data} | {ok:false, reason:'not-found'|'private'|'network'}.
    // 'private' specifically means the read was rejected by Security Rules
    // (permission-denied) — distinct from 'not-found', which is a clean,
    // rules-permitted read of a document that simply doesn't exist (see the
    // !exists() guard in the Rules themselves, which makes this distinction
    // possible instead of both cases throwing the same opaque error).
    async joinRoom(code){
      if(!cloudEnabled || !code) return { ok:false, reason:"network" };
      try{
        const snap = await fx.getDoc(fx.doc(dbHandle,"tournaments",String(code).toUpperCase()));
        if(!snap.exists()) return { ok:false, reason:"not-found" };
        const d = snap.data();
        const parsed = JSON.parse(d.data);
        if(d.ladderPointsAwarded===true) parsed.ladderPointsAwarded=true;
        if(d.ladderSeasonId) parsed.ladderSeasonId=d.ladderSeasonId;
        if(d.ladderAwardedAt) parsed.ladderAwardedAt=d.ladderAwardedAt;
        if(Array.isArray(d.ladderSkippedPlayers)) parsed.ladderSkippedPlayers=d.ladderSkippedPlayers;
        if(d.createdBy) parsed.createdBy=d.createdBy;
        if(d.ownerUid) parsed.ownerUid=d.ownerUid;
        if(d.testMode===true) parsed.testMode=true;
        if(d.testCreatedAt) parsed.testCreatedAt=d.testCreatedAt;
        if(d.testExpiresAt&&typeof d.testExpiresAt.toMillis==="function") parsed.testExpiresAtMs=d.testExpiresAt.toMillis();
        if(d.expiresAt&&typeof d.expiresAt.toMillis==="function") parsed.expiresAtMs=d.expiresAt.toMillis();
        parsed.meta=parsed.meta||{};
        if(Array.isArray(d.assignedStaffUids)) parsed.meta.assignedStaffUids=d.assignedStaffUids;
        if(d.refereeStationAssignments && typeof d.refereeStationAssignments==="object") parsed.meta.refereeStationAssignments=d.refereeStationAssignments;
        if(d.refereeStationNames && typeof d.refereeStationNames==="object") parsed.meta.refereeStationNames=d.refereeStationNames;
        if(d.refereeStationRestrictionEnabled===true) parsed.meta.refereeStationRestrictionEnabled=true;
        return { ok:true, data: parsed };
      }catch(e){
        console.warn("加入雲端賽事代碼失敗", e);
        if((e&&e.code)==="permission-denied") return { ok:false, reason:"private" };
        return { ok:false, reason:"network" };
      }
    },
