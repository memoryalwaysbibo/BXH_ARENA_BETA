<style>
:root{
  --bg:#08090a;
  --bg-soft:#0e0f11;
  --panel:#17181b;
  --panel-2:#1e2023;
  --panel-3:#26282c;
  --border:#2c2e33;
  --border-soft:#212327;
  --neon:#e9ff2e;
  --gold:#d9b95c;
  --gold-dim:#8a733a;
  --gold-glow:rgba(217,185,92,0.22);
  --obsidian:#070808;
  --imperial-gold:#D4AF37;
  --champagne-gold:#F3D98B;
  --bronze-gold:#8A6428;
  --ivory:#F7F2E8;
  --wine:#2A090D;
  --neon-dim:#b9c918;
  --neon-glow:rgba(233,255,46,0.18);
  --white:#f4f5f2;
  --metal:#9a9ea6;
  --metal-dim:#6c7078;
  --danger:#ff3b3b;
  --danger-dim:#5c1414;
  --danger-glow:rgba(255,59,59,0.18);
  --ok:#3ddc84;
  --radius:12px;
  --radius-sm:8px;
  --font-d:'Rajdhani','Noto Sans TC',sans-serif;
  --font-b:'Noto Sans TC',-apple-system,BlinkMacSystemFont,sans-serif;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg);
  color:var(--white);
  font-family:var(--font-b);
  min-height:100vh;
  -webkit-tap-highlight-color:transparent;
  overflow-x:hidden;
}
button{font-family:inherit;cursor:pointer;}
input,select,textarea{font-family:inherit;}
::-webkit-scrollbar{height:8px;width:8px;}
::-webkit-scrollbar-thumb{background:var(--panel-3);border-radius:4px;}
::-webkit-scrollbar-track{background:transparent;}

#watermark{
  position:fixed;top:0;left:0;right:0;bottom:0;
  display:flex;align-items:center;justify-content:center;
  pointer-events:none;z-index:0;
  opacity:0.055;
}
#watermark img{width:100%;height:100%;object-fit:contain;}
@media (max-width:640px){
  #watermark{opacity:0.045;}
  #watermark img{width:100%;height:100%;object-fit:contain;}
}
@media (max-width:420px){
  #watermark{opacity:0.04;}
}

#app{position:relative;z-index:1;min-height:100vh;display:flex;flex-direction:column;}

.stickytop{position:sticky;top:0;z-index:20;}
header.topbar{
  position:relative;
  display:flex;align-items:center;gap:24px;
  padding:16px 28px;
  background:linear-gradient(180deg, #101113, #08090a);
  border-bottom:1px solid var(--border);
  backdrop-filter:blur(6px);
}
header.topbar::after{
  content:"";
  position:absolute;left:0;bottom:0;width:100%;height:2px;
  background:var(--neon);
  opacity:0.5;
  pointer-events:none;
}
header.topbar .logo-wrap{
  position:relative;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  margin-left:4px;
}
header.topbar .logo-glow{
  position:absolute;left:50%;top:50%;
  width:150%;height:150%;
  transform:translate(-50%,-50%);
  background:radial-gradient(circle, rgba(233,255,46,0.14) 0%, rgba(233,255,46,0.05) 40%, transparent 72%);
  pointer-events:none;
  z-index:0;
}
header.topbar img.logo{position:relative;z-index:1;height:84px;width:auto;display:block;flex-shrink:0;}
header.topbar .brandtext{display:flex;flex-direction:column;line-height:1.15;min-width:0;position:relative;z-index:1;}
header.topbar .brandtext .t1{
  font-family:var(--font-d);font-weight:700;font-size:25px;letter-spacing:3px;
  white-space:nowrap;transform:skewX(-7deg);display:inline-block;
}
header.topbar .brandtext .t1 .w-bxh{color:var(--white);text-shadow:0 0 1px rgba(255,255,255,0.25);}
header.topbar .brandtext .t1 .w-arena{color:var(--neon);margin-left:9px;text-shadow:0 0 14px rgba(233,255,46,0.35);}
header.topbar .brandtext .t2{
  font-size:13.5px;color:#c7cad0;letter-spacing:2.5px;margin-top:6px;white-space:nowrap;font-weight:500;
}
header.topbar .brandtext .top-connection-state{
  position:relative;display:grid;grid-template-columns:auto minmax(0,1fr);grid-template-areas:"kicker kicker" "rail rail" "status status";
  gap:4px;margin-top:8px;padding-left:10px;max-width:190px;
}
header.topbar .brandtext .top-connection-state::before{
  content:"";position:absolute;left:0;top:2px;width:2px;height:30px;
  background:linear-gradient(180deg,var(--gold),rgba(217,185,92,.16));
  transform:skewX(-18deg);box-shadow:0 0 8px rgba(217,185,92,.24);
}
header.topbar .brandtext .t-conn-kicker{
  grid-area:kicker;font-family:var(--font-d);font-weight:900;font-size:8px;letter-spacing:1.8px;color:var(--gold);
  line-height:1;text-transform:uppercase;opacity:.92;
}
header.topbar .brandtext .t-rule{
  grid-area:rail;position:relative;overflow:visible;width:132px;height:13px;margin:0;border-radius:999px;color:#45ef98;
}
header.topbar .brandtext .t-rule::before{
  content:"";position:absolute;left:0;right:0;top:50%;height:1.5px;transform:translateY(-50%);border-radius:999px;
  background:linear-gradient(90deg,transparent 0%,currentColor 12%,currentColor 86%,transparent 100%);opacity:.26;
  box-shadow:0 0 8px color-mix(in srgb,currentColor 30%,transparent);
}
header.topbar .brandtext .t-rule::after{
  content:"";position:absolute;left:0;top:50%;width:7px;height:7px;border-radius:50%;background:currentColor;
  transform:translate(0,-50%);box-shadow:0 0 5px currentColor,0 0 13px currentColor,0 0 24px color-mix(in srgb,currentColor 72%,transparent);
  animation:topbarLifeDot 2.1s linear infinite;
}
header.topbar .brandtext .t-rule.connected{color:#45ef98;}
header.topbar .brandtext .t-rule.connecting{color:#e8c547;}
header.topbar .brandtext .t-rule.connecting::after{animation-duration:1.25s;}
header.topbar .brandtext .t-rule.error{color:#ff6262;}
header.topbar .brandtext .t-rule.limited{color:#e8c547;}
header.topbar .brandtext .t-rule.limited::after{animation-duration:1.6s;}
header.topbar .brandtext .t-rule.error::after{animation:topbarLifeError .95s ease-in-out infinite;}
header.topbar .brandtext .t-rule.local{color:#7a8088;}
header.topbar .brandtext .t-rule.local::after{animation-duration:2.8s;opacity:.58;}
header.topbar .brandtext .t-conn-status{
  grid-area:status;display:flex;align-items:center;gap:6px;min-width:0;font-size:9.5px;letter-spacing:.7px;color:#aeb5bf;font-weight:750;line-height:1.1;
}
header.topbar .brandtext .t-conn-status strong{font-family:var(--font-d);font-size:9px;letter-spacing:1px;color:currentColor;}
header.topbar .brandtext .t-conn-dot{width:6px;height:6px;border-radius:50%;display:inline-block;flex:0 0 auto;box-shadow:0 0 10px currentColor;}
header.topbar .brandtext .t-conn-dot.connected{background:#3ddc84;color:#3ddc84;}
header.topbar .brandtext .t-conn-dot.connecting{background:#e8c547;color:#e8c547;animation:cloud-pulse 1s ease-in-out infinite;}
header.topbar .brandtext .t-conn-dot.error{background:#ff6666;color:#ff6666;animation:topbarLifeError .95s ease-in-out infinite;}
header.topbar .brandtext .t-conn-dot.limited{background:#e8c547;color:#e8c547;animation:cloud-pulse 1.4s ease-in-out infinite;}
header.topbar .brandtext .t-conn-dot.local{background:#7a8088;color:#7a8088;}
@keyframes topbarLifeDot{
  0%{left:0;top:50%;opacity:.15}
  8%{opacity:1}
  42%{left:44%;top:50%}
  48%{left:50%;top:5%}
  54%{left:56%;top:50%}
  92%{opacity:1}
  100%{left:calc(100% - 7px);top:50%;opacity:.12}
}
@keyframes topbarLifeError{0%,100%{opacity:.28;transform:translate(54px,-50%) scale(.82)}50%{opacity:1;transform:translate(54px,-50%) scale(1.18)}}
header.topbar .spacer{flex:1;position:relative;z-index:1;}
header.topbar .status-pill{position:relative;z-index:1;
  font-family:var(--font-d);font-weight:600;font-size:13px;
  padding:6px 14px;border-radius:20px;border:1px solid var(--border);
  white-space:nowrap;flex-shrink:0;
}
@media (max-width:640px){
  header.topbar{padding:12px 16px;gap:14px;}
  header.topbar img.logo{height:70px;}
  header.topbar .brandtext .t1{font-size:18px;letter-spacing:1.6px;}
  header.topbar .brandtext .t1 .w-arena{margin-left:6px;}
  header.topbar .brandtext .t2{font-size:10.5px;letter-spacing:1.5px;margin-top:4px;}
  header.topbar .brandtext .top-connection-state{gap:3px;margin-top:6px;max-width:150px;padding-left:8px;}
  header.topbar .brandtext .top-connection-state::before{height:27px;}
  header.topbar .brandtext .t-rule{width:105px;height:12px;}
  header.topbar .brandtext .t-conn-kicker{font-size:7px;letter-spacing:1.25px;}
  header.topbar .brandtext .t-conn-status{font-size:8px;letter-spacing:.45px;}
}
@media (max-width:380px){
  header.topbar{padding:10px 12px;gap:10px;}
  header.topbar img.logo{height:64px;}
  header.topbar .brandtext .t1{font-size:15px;letter-spacing:1px;}
  header.topbar .status-pill{font-size:11px;padding:5px 10px;}
}
.status-waiting{color:var(--metal);border-color:var(--border);}
.status-live{color:var(--danger);border-color:var(--danger);background:var(--danger-glow);}
.status-done{color:var(--neon);border-color:var(--neon-dim);background:var(--neon-glow);}

nav.tabs{
  display:flex;flex-wrap:nowrap;gap:4px;padding:8px 12px;overflow-x:auto;overflow-y:hidden;
  background:var(--bg-soft);border-bottom:1px solid var(--border);
  scrollbar-width:none;-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain;touch-action:pan-x;
}
nav.tabs::-webkit-scrollbar{display:none;}
nav.tabs button{
  font-family:var(--font-d);font-weight:600;font-size:15px;letter-spacing:0.5px;
  background:transparent;color:var(--metal);border:1px solid transparent;
  padding:10px 18px;border-radius:8px;white-space:nowrap;
  flex:0 0 auto;min-width:max-content;
  transition:color .15s, border-color .15s, background .15s;
}
nav.tabs button.active{color:var(--neon);border-color:var(--neon-dim);background:rgba(233,255,46,0.06);}
nav.tabs button:not(.active):hover{color:var(--white);background:var(--panel-2);}

main{flex:1;padding:16px;max-width:1180px;margin:0 auto;width:100%;}
main,.panel,.grid,.field{min-width:0;}
input,select,textarea{max-width:100%;min-width:0;}
@media (max-width:640px){main{padding:12px;}}

.panel{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:18px;}
.panel + .panel{margin-top:14px;}
.panel-title{font-family:var(--font-d);font-weight:700;font-size:16px;color:var(--white);margin:0 0 12px;letter-spacing:0.3px;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;}

.grid{display:grid;gap:12px;}
.grid-4{grid-template-columns:repeat(4,minmax(0,1fr));}
.grid-3{grid-template-columns:repeat(3,minmax(0,1fr));}
.grid-2{grid-template-columns:repeat(2,minmax(0,1fr));}
@media (max-width:860px){.grid-4{grid-template-columns:repeat(2,minmax(0,1fr));}.grid-3{grid-template-columns:repeat(2,minmax(0,1fr));}}
@media (max-width:520px){.grid-4,.grid-3,.grid-2{grid-template-columns:repeat(2,minmax(0,1fr));}}

.stat-box{background:var(--panel-2);border:1px solid var(--border-soft);border-radius:var(--radius-sm);padding:12px 14px;min-width:0;max-width:100%;overflow:hidden;}
.stat-box .label{font-size:12px;color:var(--metal);margin-bottom:4px;}
.stat-box .value{font-family:var(--font-d);font-weight:700;font-size:26px;color:var(--neon);}
.stat-box .value.small{font-size:18px;color:var(--white);min-width:0;max-width:100%;overflow-wrap:anywhere;word-break:break-word;}

.btn{
  font-family:var(--font-d);font-weight:600;font-size:14px;letter-spacing:0.3px;
  padding:11px 18px;border-radius:8px;border:1px solid var(--border);
  background:var(--panel-2);color:var(--white);
  min-height:44px;display:inline-flex;align-items:center;justify-content:center;gap:8px;
  transition:transform .08s, border-color .15s, background .15s;
}
.btn:active{transform:scale(0.97);}
.btn:hover{border-color:var(--metal-dim);}
.btn-primary{background:var(--neon);color:#0a0a0a;border-color:var(--neon);}
.btn-primary:hover{background:var(--neon-dim);border-color:var(--neon-dim);}
.btn-danger{background:transparent;color:var(--danger);border-color:var(--danger);}
.btn-danger:hover{background:var(--danger-glow);}
.btn-danger-solid{background:var(--danger);color:#fff;border-color:var(--danger);}
.btn-ghost{background:transparent;border-color:var(--border);color:var(--metal);}
.btn-ghost:hover{color:var(--white);}
.btn-block{width:100%;}
.btn-sm{padding:8px 12px;font-size:13px;min-height:38px;}
.btn:disabled{opacity:0.35;cursor:not-allowed;transform:none;}
.btn-row{display:flex;gap:10px;flex-wrap:wrap;}

.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px;}
.field label{font-size:13px;color:var(--metal);font-weight:500;}
.field input[type=text],.field input[type=date],.field input[type=time],.field input[type=number],.field select,.field textarea{
  background:var(--panel-2);border:1px solid var(--border);color:var(--white);
  border-radius:8px;padding:11px 12px;font-size:15px;min-height:44px;width:100%;
}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--neon-dim);}
.field textarea{min-height:180px;resize:vertical;font-family:var(--font-b);line-height:1.6;}
.hint{font-size:12px;color:var(--metal-dim);margin-top:2px;}
.warn-text{font-size:12px;color:var(--danger);margin-top:4px;}

.badge{display:inline-flex;align-items:center;font-size:12px;font-weight:600;padding:3px 10px;border-radius:12px;font-family:var(--font-d);}
.badge-neon{background:var(--neon-glow);color:var(--neon);border:1px solid var(--neon-dim);}
.badge-gold{background:rgba(199,162,80,.12);color:var(--gold);border:1px solid rgba(199,162,80,.42);}
.badge-danger{background:var(--danger-glow);color:var(--danger);border:1px solid var(--danger);}
.badge-metal{background:var(--panel-3);color:var(--metal);border:1px solid var(--border);}
.badge-ok{background:rgba(61,220,132,0.12);color:var(--ok);border:1px solid var(--ok);}

table.rank-table{width:100%;border-collapse:collapse;font-size:14px;}
table.rank-table th{text-align:left;color:var(--metal);font-weight:600;font-size:12px;padding:8px 8px;border-bottom:1px solid var(--border);white-space:nowrap;}
table.rank-table td{padding:9px 8px;border-bottom:1px solid var(--border-soft);white-space:nowrap;}
table.rank-table tr:last-child td{border-bottom:none;}
.rank-scroll{overflow-x:auto;max-height:420px;overflow-y:auto;}
.rank-name{color:var(--white);font-weight:600;}
.rank-num{font-family:var(--font-d);font-weight:700;color:var(--neon);}

.match-live-card{background:linear-gradient(135deg, rgba(255,59,59,0.08), rgba(233,255,46,0.04));border:1px solid var(--danger);border-radius:var(--radius);padding:16px;}
.match-live-card .top{display:flex;align-items:center;gap:8px;margin-bottom:10px;}
.match-live-card .vs{display:flex;align-items:center;justify-content:space-between;gap:12px;}
.match-live-card .p{font-family:var(--font-d);font-weight:700;font-size:20px;color:var(--white);}
.match-live-card .sc{font-family:var(--font-d);font-weight:700;font-size:32px;color:var(--neon);}
.match-live-card .mid{color:var(--metal);font-size:13px;}

.bracket-wrap{position:relative;z-index:1;overflow-x:auto;padding-bottom:8px;}
.event-title-bar{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;margin-bottom:12px;}
.event-title-center{display:flex;align-items:center;gap:10px;justify-self:center;min-width:0;max-width:100%;}
.event-title-name{font-family:var(--font-d);font-weight:700;font-size:16px;color:var(--white);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:46vw;letter-spacing:0.3px;}
.event-title-right{justify-self:end;display:flex;align-items:center;gap:8px;}
@media (max-width:640px){
  .event-title-bar{grid-template-columns:1fr;row-gap:8px;}
  .event-title-right{justify-self:start;order:-1;}
  .event-title-center{justify-self:center;}
  .event-title-name{max-width:62vw;}
}
.share-btn{
  position:relative;width:44px;height:44px;flex-shrink:0;border-radius:50%;
  background:rgba(10,10,11,0.72);border:1px solid var(--gold-dim);color:var(--gold);
  display:flex;align-items:center;justify-content:center;
  transition:box-shadow .15s, transform .08s, border-color .15s;
}
.share-btn:hover{border-color:var(--gold);box-shadow:0 0 0 4px var(--gold-glow);}
.share-btn:active{transform:scale(0.93);}
.share-btn:focus-visible{outline:2px solid var(--gold);outline-offset:2px;}
.share-btn svg{width:19px;height:19px;}
.checkin-btn-pending{background:rgba(10,10,11,0.6);border:1px solid var(--gold-dim);color:var(--gold);}
.checkin-btn-pending:hover{border-color:var(--gold);}
.checkin-btn-done{background:rgba(61,220,132,0.14);border:1px solid var(--ok);color:var(--ok);}
.checkin-btn-done:hover{background:rgba(61,220,132,0.22);}
.share-modal-box{max-width:440px;}
.share-modal-header{display:flex;align-items:center;gap:12px;}
.share-modal-logo{width:44px;height:44px;object-fit:contain;flex-shrink:0;}
.share-summary-box{margin-top:12px;background:var(--panel-2);border:1px solid var(--border);border-radius:8px;padding:12px 14px;font-size:13px;line-height:1.7;color:var(--white);white-space:normal;}
.share-target-tabs{display:flex;gap:8px;overflow-x:auto;padding:4px 0 8px;scrollbar-width:none;}
.share-target-tabs::-webkit-scrollbar{display:none;}
.share-target-tabs button{flex:0 0 auto;white-space:nowrap;}
.share-qr-box{width:236px;min-height:236px;margin:14px auto 8px;padding:10px;background:#fff;border-radius:12px;display:flex;align-items:center;justify-content:center;}
.share-qr-box img,.share-qr-box canvas{display:block;max-width:216px!important;max-height:216px!important;}
.qr-scanner-box{position:relative;overflow:hidden;border:1px solid var(--gold-dim);border-radius:12px;background:#000;aspect-ratio:1/1;margin-top:12px;}
.qr-scanner-video{width:100%;height:100%;object-fit:cover;display:block;}
.qr-scanner-frame{position:absolute;inset:14%;border:2px solid var(--gold);border-radius:12px;box-shadow:0 0 0 999px rgba(0,0,0,.32);pointer-events:none;}
.qr-scanner-line{position:absolute;left:17%;right:17%;top:50%;height:2px;background:var(--neon);box-shadow:0 0 10px var(--neon);animation:qrScanLine 1.8s ease-in-out infinite;pointer-events:none;}
@keyframes qrScanLine{0%,100%{transform:translateY(-90px);opacity:.45}50%{transform:translateY(90px);opacity:1}}
.bracket-wm-wrap{position:relative;isolation:isolate;min-width:0;}
.bracket-wm{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;z-index:0;overflow:hidden;}
.bracket-wm img{width:100%;height:100%;object-fit:contain;opacity:0.07;filter:saturate(0.5);}
.bracket-wm-content{position:relative;z-index:1;min-width:0;max-width:100%;}
.se-bracket-outer{position:relative;}
.se-bracket-svg{position:absolute;left:0;top:0;z-index:1;pointer-events:none;}
.se-bracket-cols{display:flex;gap:56px;min-width:max-content;padding:8px 4px;position:relative;z-index:2;}
.se-col{display:flex;flex-direction:column;min-width:220px;position:relative;}
.se-col-title{font-family:var(--font-d);font-weight:700;font-size:13px;color:var(--metal);text-align:center;margin-bottom:14px;letter-spacing:1px;}
.se-col[data-round="0"] .match-box{position:relative;margin-bottom:22px;}
.se-col[data-round="0"] .match-box:last-child{margin-bottom:0;}
.se-col:not([data-round="0"]) .match-box{position:absolute;left:0;right:0;top:0;}
.se-bronze-col{margin-top:0;}
.bracket-cols{display:flex;gap:34px;min-width:max-content;padding:8px 4px;}
.bracket-col{display:flex;flex-direction:column;justify-content:space-around;gap:18px;min-width:220px;}
.bracket-col-title{font-family:var(--font-d);font-weight:700;font-size:13px;color:var(--metal);text-align:center;margin-bottom:6px;letter-spacing:1px;}
.match-box{background:var(--panel-2);border:1px solid var(--border);border-radius:8px;overflow:hidden;cursor:pointer;transition:border-color .15s;}
.match-box:hover{border-color:var(--neon-dim);}
.match-box.done{border-color:var(--neon-dim);}
.match-box .mb-head{font-size:11px;color:var(--metal-dim);padding:5px 10px;background:var(--panel-3);display:flex;justify-content:space-between;}
.match-box .mb-row{display:flex;justify-content:space-between;align-items:center;padding:8px 10px;font-size:14px;border-top:1px solid var(--border-soft);}
.match-box .mb-row.winner{color:var(--neon);font-weight:700;}
.match-box .mb-row .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:130px;}
.match-box .mb-row .sc{font-family:var(--font-d);font-weight:700;}

/* ==== match status system (pending/ready/in_progress/completed/paused) ==== */
.match-box.ms-card-pending{border-color:#3a3d42;}
.match-box.ms-card-in_progress{
  border-color:#D4AF37;
  background:linear-gradient(160deg, rgba(212,175,55,0.06), var(--panel-2));
  box-shadow:0 0 0 1px rgba(212,175,55,0.25), 0 0 14px rgba(212,175,55,0.35);
  animation:ms-breathe-gold 1.8s ease-in-out infinite;
}
@keyframes ms-breathe-gold{
  0%,100%{ box-shadow:0 0 0 1px rgba(212,175,55,0.22), 0 0 10px rgba(212,175,55,0.22); border-color:#b8933f; }
  50%{ box-shadow:0 0 0 1.5px rgba(243,217,139,0.55), 0 0 22px rgba(212,175,55,0.55); border-color:#F3D98B; }
}
.match-box.ms-card-in_progress .mb-head{color:#D4AF37;}
.match-box.ms-card-in_progress .mb-row .sc{color:#F3D98B;font-size:16px;}

.match-box.ms-card-ready{
  border-color:#4CB8FF;
  background:linear-gradient(160deg, rgba(76,184,255,0.05), var(--panel-2));
  box-shadow:0 0 0 1px rgba(76,184,255,0.2), 0 0 12px rgba(76,184,255,0.3);
  animation:ms-breathe-ice 2.7s ease-in-out infinite;
}
@keyframes ms-breathe-ice{
  0%,100%{ box-shadow:0 0 0 1px rgba(76,184,255,0.18), 0 0 8px rgba(76,184,255,0.18); border-color:#3a92c9; }
  50%{ box-shadow:0 0 0 1.5px rgba(169,226,255,0.5), 0 0 18px rgba(76,184,255,0.4); border-color:#A9E2FF; }
}

.match-box.ms-card-completed{border-color:#6b6248;}
.match-box.ms-card-completed .mb-row.winner{color:#D4AF37;font-weight:700;}
.match-box.ms-card-completed .mb-row:not(.winner){opacity:0.55;}

.match-box.ms-card-paused{border-color:#8A6428;border-style:dashed;}

.match-status-bar{
  font-family:var(--font-d);font-size:11px;font-weight:600;
  padding:4px 10px;margin-top:6px;border-radius:4px;
  display:flex;align-items:center;gap:6px;
}
.ms-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0;background:currentColor;}
.match-status-bar.ms-bar-in_progress{color:#D4AF37;background:rgba(212,175,55,0.12);}
.match-status-bar.ms-bar-in_progress .ms-dot{animation:ms-dot-pulse 1.8s ease-in-out infinite;}
.match-status-bar.ms-bar-ready{color:#4CB8FF;background:rgba(15,30,45,0.55);}
.match-status-bar.ms-bar-ready .ms-dot{animation:ms-dot-pulse 2.7s ease-in-out infinite;}
.match-status-bar.ms-bar-completed{color:#8FAF72;background:rgba(143,175,114,0.08);}
.match-status-bar.ms-bar-pending{color:var(--metal-dim);background:rgba(255,255,255,0.03);}
.match-status-bar.ms-bar-paused{color:#c9a24d;background:rgba(138,100,40,0.12);}
@keyframes ms-dot-pulse{0%,100%{opacity:0.4;}50%{opacity:1;}}

.match-status-legend{
  display:flex;flex-wrap:wrap;gap:14px;
  padding:10px 4px 14px;font-size:12px;color:var(--metal);
}
.legend-item{display:flex;align-items:center;gap:6px;}
.legend-swatch{width:14px;height:14px;border-radius:3px;border:2px solid;flex-shrink:0;}
.legend-in_progress{border-color:#D4AF37;box-shadow:0 0 6px rgba(212,175,55,0.5);}
.legend-ready{border-color:#4CB8FF;box-shadow:0 0 6px rgba(76,184,255,0.4);}
.legend-completed{border-color:#6b6248;}
.legend-pending{border-color:#3a3d42;}

.match-status-controls{
  display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;
  margin-bottom:12px;padding:8px 12px;background:var(--panel-2);border-radius:8px;border:1px solid var(--border-soft);
}
.msc-label{font-size:12.5px;color:var(--metal);display:flex;align-items:center;gap:8px;}
.msc-btns{display:flex;gap:8px;flex-wrap:wrap;}
.ms-inline{display:inline-flex;align-items:center;gap:6px;font-weight:700;}
.ms-inline-in_progress{color:#D4AF37;}
.ms-inline-ready{color:#4CB8FF;}
.ms-inline-completed{color:#8FAF72;}
.ms-inline-pending{color:var(--metal-dim);}
.ms-inline-paused{color:#c9a24d;}
.ms-inline .ms-dot{animation-play-state:running;}
.ms-inline-in_progress .ms-dot{animation:ms-dot-pulse 1.8s ease-in-out infinite;}
.ms-inline-ready .ms-dot{animation:ms-dot-pulse 2.7s ease-in-out infinite;}

@media (prefers-reduced-motion: reduce){
  .match-box.ms-card-in_progress{animation:none; box-shadow:0 0 0 1.5px rgba(243,217,139,0.5), 0 0 16px rgba(212,175,55,0.4); border-color:#F3D98B;}
  .match-box.ms-card-ready{animation:none; box-shadow:0 0 0 1.5px rgba(169,226,255,0.45), 0 0 14px rgba(76,184,255,0.32); border-color:#A9E2FF;}
  .match-status-bar .ms-dot, .ms-inline .ms-dot{animation:none !important;}
}
@media (max-width:640px){
  .match-status-legend{gap:10px;font-size:11px;}
  .match-status-controls{flex-direction:column;align-items:stretch;}
}

/* ==== quick decision mode (簡易判定模式) ==== */
.qd-mode-title{font-family:var(--font-d);font-weight:700;font-size:18px;color:var(--gold);text-align:center;margin-top:6px;}
.qd-mode-sub{font-size:13px;color:var(--metal);text-align:center;margin-top:4px;margin-bottom:18px;}
.qd-cards{display:flex;gap:16px;}
.qd-card{
  flex:1;display:flex;flex-direction:column;align-items:center;text-align:center;
  padding:28px 18px;border-radius:12px;background:var(--panel-2);border:1px solid var(--border);
}
.qd-icon{width:44px;height:44px;color:var(--gold-dim);margin-bottom:10px;}
.qd-icon svg{width:100%;height:100%;}
.qd-name{font-family:var(--font-d);font-weight:700;font-size:22px;color:var(--white);word-break:break-word;}
.qd-meta{font-size:12.5px;color:var(--metal);margin-top:6px;margin-bottom:18px;}
.qd-choose-btn{
  width:100%;min-height:56px;border-radius:8px;border:1px solid var(--gold-dim);
  background:linear-gradient(180deg,var(--champagne-gold),var(--imperial-gold));color:#141208;
  font-family:var(--font-d);font-weight:700;font-size:15px;
}
.qd-choose-btn:disabled{opacity:0.4;background:var(--panel-3);color:var(--metal-dim);border-color:var(--border);}
.qd-win-tag{color:#D4AF37;font-weight:700;}
.qd-tag{
  display:inline-block;margin-left:8px;font-size:10px;font-weight:700;padding:1px 6px;border-radius:8px;
  background:rgba(212,175,55,0.15);color:#D4AF37;letter-spacing:0.5px;vertical-align:middle;
}
@media (max-width:640px){
  .qd-cards{flex-direction:column;}
}

.scoring-mode-cards{display:flex;gap:12px;margin-top:10px;}
.scoring-mode-card{
  flex:1;text-align:left;padding:14px 16px;border-radius:10px;
  background:var(--panel-2);border:1px solid var(--border);cursor:pointer;
}
.scoring-mode-card.active{border-color:var(--gold);background:linear-gradient(160deg, rgba(217,185,92,0.1), var(--panel-2));}
.scoring-mode-card:disabled{opacity:0.5;cursor:not-allowed;}
.smc-title{font-family:var(--font-d);font-weight:700;font-size:14px;color:var(--white);}
.scoring-mode-card.active .smc-title{color:var(--gold);}
.smc-desc{font-size:12px;color:var(--metal);margin-top:4px;}
@media (max-width:640px){
  .scoring-mode-cards{flex-direction:column;}
}
.round-scoring-list{display:flex;flex-direction:column;gap:8px;margin-top:10px;}
.round-scoring-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:8px 10px;background:var(--panel-2);border-radius:8px;}
.rsr-label{font-size:13px;color:var(--white);min-width:80px;font-weight:600;}

/* ==== bracket view mode toggle + board (kiosk) mode ==== */
.bracket-view-toggle{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:3px;margin:0 0 14px;padding:3px;border:1px solid rgba(217,185,92,.24);border-radius:12px;background:rgba(8,9,10,.72);box-shadow:inset 0 1px 0 rgba(255,255,255,.025);}
.bvt-btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:9px 14px;border:0;border-radius:9px;background:transparent;color:var(--metal);font-family:var(--font-d);font-weight:700;font-size:13px;letter-spacing:.35px;cursor:pointer;transition:color .18s ease,background .18s ease,box-shadow .18s ease,transform .18s ease;}
.bvt-btn svg{width:17px;height:17px;flex:0 0 auto;}
.bvt-btn:hover{color:var(--white);background:rgba(255,255,255,.035);}
.bvt-btn.active{color:#171307;background:linear-gradient(180deg,#f3d878,#c89c2b);box-shadow:0 5px 18px rgba(217,185,92,.22),inset 0 1px 0 rgba(255,255,255,.48);}
.bvt-btn:active{transform:translateY(1px);}
.single-bracket-layout-toggle{display:flex;gap:8px;flex-wrap:wrap;margin:-4px 0 14px;}
.single-bracket-layout-toggle .btn.active{border-color:var(--gold);color:var(--gold);background:rgba(217,185,92,0.1);}
.match-box.bye-placeholder{visibility:hidden;pointer-events:none;}
.compact-bracket{display:flex;flex-direction:column;gap:18px;}
.compact-round{border:1px solid var(--border);border-radius:12px;background:rgba(15,15,16,0.78);overflow:hidden;}
.compact-round-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px 14px;background:var(--panel-3);border-bottom:1px solid var(--border);}
.compact-round-title{font-family:var(--font-d);font-weight:700;color:var(--gold);font-size:14px;letter-spacing:.5px;}
.compact-round-count{font-size:11px;color:var(--metal-dim);white-space:nowrap;}
.compact-round-matches{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px;padding:12px;}
.compact-round .match-box{min-width:0;}
@media (max-width:640px){
  .bracket-view-toggle{position:sticky;top:calc(var(--sticky-header-h, 0px) + 6px);z-index:12;margin-bottom:10px;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);}
  .bvt-btn{min-height:42px;padding:8px 6px;font-size:12px;}
  .single-bracket-layout-toggle{display:grid;grid-template-columns:1fr 1fr;}
  .single-bracket-layout-toggle .btn{width:100%;}
  .compact-bracket{gap:12px;}
  .compact-round-matches{grid-template-columns:1fr;padding:9px;}
  .compact-round-head{padding:10px 12px;position:sticky;top:0;z-index:2;}
}

.board-shell{
  --board-accent: #d9b95c;
  position:relative;border-radius:16px;overflow:hidden;
  background:linear-gradient(180deg, #0d0e0a 0%, #08090a 55%, #030303 100%);
  border:1px solid var(--board-accent);padding:18px;
  box-shadow:0 20px 50px rgba(0,0,0,0.5), inset 0 0 60px rgba(0,0,0,0.4);
}
.board-shell[data-board-theme="gold"]{ --board-accent:#d9b95c; }
.board-shell[data-board-theme="cyan"]{ --board-accent:#2ee6d6; }
.board-shell[data-board-theme="violet"]{ --board-accent:#b48cff; }
.board-shell[data-board-theme="amber"]{ --board-accent:#f0a94e; }
.board-shell[data-board-theme="red"]{ --board-accent:#ef5b5b; }
.board-shell[data-board-theme="rose"]{ --board-accent:#f082b0; }
.board-shell[data-board-theme="ice"]{ --board-accent:#5fc4ff; }
.board-wm{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;overflow:hidden;z-index:0;}
.board-wm img{width:55%;max-width:520px;opacity:0.05;}
.board-header{position:relative;z-index:1;display:flex;align-items:center;justify-content:space-between;gap:14px;padding-bottom:14px;border-bottom:1px solid var(--board-accent);margin-bottom:14px;}
.board-header-left{display:flex;align-items:center;gap:12px;}
.board-logo{height:44px;width:auto;}
.board-title{font-family:var(--font-d);font-weight:700;font-size:16px;color:var(--board-accent);letter-spacing:1px;}
.board-sub{font-size:12px;color:var(--metal);margin-top:2px;}
.board-status-chip{padding:2px 8px;border-radius:10px;font-weight:700;font-size:11px;}
.board-status-chip.status-waiting{color:var(--metal);background:rgba(255,255,255,0.05);}
.board-status-chip.status-live{color:var(--danger);background:rgba(255,59,59,0.12);}
.board-status-chip.status-done{color:#8FAF72;background:rgba(143,175,114,0.12);}

.board-toolbar{position:relative;z-index:1;display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-bottom:6px;}
.board-toolbar .btn{color:var(--white);}
.board-toolbar .btn:hover{border-color:var(--board-accent);}
.board-zoom-group{display:flex;align-items:center;gap:6px;padding:2px 4px;border:1px solid var(--border);border-radius:8px;}
.board-zoom-group .btn{padding:4px 8px;min-height:0;}
.board-zoom-pct{font-family:var(--font-d);font-weight:700;font-size:12.5px;color:var(--board-accent);min-width:42px;text-align:center;}
.board-theme-select{background:var(--panel-2);color:var(--white);border:1px solid var(--border);border-radius:8px;padding:6px 10px;font-size:12.5px;}

.board-viewport{
  position:relative;z-index:1;overflow:hidden;border-radius:10px;
  background:rgba(0,0,0,0.25);border:1px solid var(--border-soft);
  height:min(70vh,760px);cursor:grab;touch-action:none;
}
.board-canvas{
  transform-origin:0 0;padding:24px;width:max-content;min-width:100%;
  transition:transform .05s linear;
}
.board-champion-area{
  margin-top:26px;padding:22px;border-radius:12px;text-align:center;
  background:linear-gradient(160deg, rgba(217,185,92,0.08), rgba(0,0,0,0.2));
  border:1px solid var(--board-accent);width:220px;
}
.board-trophy{display:inline-block;width:52px;height:52px;color:var(--board-accent);}
.board-trophy svg{width:100%;height:100%;}
.board-champion-label{font-family:var(--font-d);font-weight:700;font-size:12px;letter-spacing:3px;color:var(--board-accent);margin-top:6px;}
.board-champion-name{font-family:var(--font-d);font-weight:700;font-size:22px;margin-top:6px;
  background:linear-gradient(180deg,#FFF0A6,var(--board-accent));-webkit-background-clip:text;background-clip:text;color:transparent;
}
.board-champion-name.pending{color:var(--metal-dim);background:none;-webkit-background-clip:initial;}

.board-footer{position:relative;z-index:1;display:flex;justify-content:flex-end;margin-top:10px;}
.board-code{font-family:var(--font-d);font-size:11px;color:var(--metal-dim);letter-spacing:1px;}

.board-canvas .se-bronze-col .match-box,
.board-canvas .bracket-col.se-bronze-col{border-color:#B87333;}
.board-canvas .se-bronze-col .bracket-col-title{color:#B87333;}

.board-export-freeze .match-box.ms-card-in_progress,
.board-export-freeze .match-box.ms-card-ready{animation:none !important;}
.board-export-freeze .ms-dot{animation:none !important;}

@media (max-width:640px){
  .board-shell{padding:12px;}
  .board-header{flex-direction:column;align-items:flex-start;gap:10px;}
  .board-toolbar{gap:6px;}
  .board-viewport{height:60vh;}
  .board-logo{height:34px;}
}

 .board-header{flex-direction:row;align-items:flex-start;gap:8px;}

/* ==== version update page ==== */
.version-page{max-width:760px;margin:0 auto;}
.version-hero{
  position:relative;overflow:hidden;text-align:center;padding:28px 20px;border-radius:14px;margin-top:10px;
  background:linear-gradient(160deg, rgba(217,185,92,0.12), rgba(0,0,0,0.3));
  border:1px solid var(--gold);
}
.version-hero-badge{
  display:inline-block;font-family:var(--font-d);font-weight:700;font-size:32px;
  background:linear-gradient(180deg,#FFF0A6,var(--gold),var(--gold-dim));
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
.version-hero-internal{font-size:12px;color:var(--metal);margin-top:2px;font-family:var(--font-d);letter-spacing:1px;}
.version-hero-title{font-family:var(--font-d);font-weight:700;font-size:18px;color:var(--white);margin-top:14px;}
.version-hero-meta{font-size:12px;color:var(--metal);margin-top:6px;}
.version-level-chip{
  display:inline-block;margin-top:12px;padding:3px 12px;border-radius:12px;font-size:11px;font-weight:700;
  font-family:var(--font-d);letter-spacing:1px;

/* ---------- multi-court referee grid (dynamic, never hardcoded to N) ---------- */
.court-grid{display:grid;gap:18px;}

/* Multiple referee windows are always ordered left→right, then top→bottom: 1 2 / 3 4 / 5 6 ... */
.court-card{
  scroll-margin-top:70px;
  align-self:stretch;
  box-sizing:border-box;
  position:relative;
  overflow:hidden;
  border-color:var(--court-accent,var(--border));
  box-shadow:
    0 0 0 1px var(--court-glow-soft,transparent),
    0 0 24px var(--court-glow,transparent),
    inset 0 1px 0 var(--court-glow-soft,transparent);
}
.court-card::before{
  content:"";
  position:absolute;inset:0 0 auto 0;height:5px;
  background:var(--court-accent,var(--gold));
  box-shadow:0 0 18px var(--court-accent,var(--gold)),0 0 34px var(--court-glow,transparent);
  pointer-events:none;
}
.court-card::after{
  content:"";
  position:absolute;inset:0;
  background:radial-gradient(circle at 50% 0%,var(--court-glow-soft,transparent),transparent 44%);
  pointer-events:none;z-index:0;
}
.court-card > *{position:relative;z-index:1;}

}
.court-jump-btn{

  padding:6px 14px;border-radius:8px;font-size:12.5px;font-weight:800;min-height:36px;
  box-shadow:0 0 10px var(--court-glow,transparent);
}

.fw-particle{position:absolute;width:6px;height:6px;border-radius:50%;opacity:0;animation:fw-burst 1.5s ease-out forwards;box-shadow:0 0 6px currentColor;}
@keyframes fw-burst{0%{transform:translate(0,0) scale(1);opacity:1;}100%{transform:translate(var(--dx),var(--dy)) scale(0.15);opacity:0;}}
.fw-confetti{position:absolute;width:6px;height:12px;opacity:0;animation:fw-fall 3.6s linear forwards;}
@keyframes fw-fall{0%{transform:translateY(-20px) rotate(0deg);opacity:1;}100%{transform:translateY(360px) rotate(320deg);opacity:0;}}
.fw-static{position:absolute;width:5px;height:5px;border-radius:50%;background:var(--champagne-gold);opacity:0.5;}

// Only ever populated from a REAL successful public join, never fabricated.
let recentPublicTournaments = [];
const RECENT_TOURNAMENTS_KEY = "bxh_recent_public_tournaments_v1";
async function loadRecentPublicTournaments(){
  try{
    const res = await window.storage.get(RECENT_TOURNAMENTS_KEY);
    if(res && res.value){ recentPublicTournaments = JSON.parse(res.value).slice(0,3); }
  }catch(e){ recentPublicTournaments = []; }
}
async function recordRecentPublicTournament(code, name){
  try{
    const filtered = recentPublicTournaments.filter(r=>r.code!==code);
    filtered.unshift({ code, name: name||"未命名賽事", viewedAt: Date.now() });
    recentPublicTournaments = filtered.slice(0,3);
    await window.storage.set(RECENT_TOURNAMENTS_KEY, JSON.stringify(recentPublicTournaments));
  }catch(e){ /* best-effort only — never blocks the join itself */ }
}

let moodState=null;
function moodContext(){
 const key=currentAuthUid()+':'+engagementSessionEpoch;
 if(!moodState||moodState.key!==key)moodState={key,revision:0,messages:null,loading:false,busy:false,open:false,paused:false,text:'',operationId:null,error:'',canModerate:false};
 return moodState;
}
function moodLength(text){return [...new Intl.Segmenter('zh-Hant',{granularity:'grapheme'}).segment(text.normalize('NFKC').trim())].length;}
function moodError(e){
 const message=String(e?.message||'');
 const errors={'text-length':'留言請輸入 1～30 字。','blocked-text':'留言含有不適合公開的字詞，請調整後再送出。','no-links':'心情小棧不開放連結或電子郵件，請改成短留言。','invalid-text':'請使用單行文字，並移除隱藏字元。','daily-limit':'今天已發布 10 則，台灣時間 00:00 後可再留言。','cooldown':'每則留言至少間隔 60 秒，請稍後再試。','account-inactive':'此帳號目前無法留言。','not-owner':'只能刪除自己的留言。','login-required':'請先登入後再留言。'};
 for(const[key,value]of Object.entries(errors))if(message.includes(key))return value;
 return '心情小棧暫時無法連線，請稍後重試。';
}
async function loadMood(){
 const c=moodContext();if(!firebaseUser?.uid||c.busy){c.loading=false;return;}
 c.loading=true;const revision=c.revision;
 try{const r=await window.engagementService.mood({action:'list'});if(c!==moodContext()||revision!==c.revision)return;if(!r?.ok)throw Error('load-failed');c.messages=r.messages||[];c.canModerate=r.canModerate===true;c.error='';}
 catch(e){if(c===moodContext()&&revision===c.revision)c.error=moodError(e);}
 finally{if(c===moodContext()){c.loading=false;render();}}
}
function renderMoodStation(){
 if(!firebaseUser?.uid||guestReadOnlyMode)return '';
 const c=moodContext();
 if(c.messages===null&&!c.loading&&!c.error){c.loading=true;setTimeout(loadMood,0);}
 const items=(c.messages||[]).filter(m=>Number(m.createdAt)>Date.now()-86400000);
 const carousel=items.filter(m=>m.inCarousel!==false);
 const group=carousel.map(m=>`<span class="mood-item"><b>${esc(m.name)}</b>：${esc(m.text)}</span>`).join('');
 return `<section class="panel mood-station" aria-label="心情小棧">
 <div class="mood-head"><b>☕ 心情小棧</b><div class="btn-row"><button class="btn btn-ghost btn-sm" data-action="mood-expand" aria-expanded="${!!c.expanded}" aria-controls="mood-all">${c.expanded?'收合留言 ▴':'查看全部留言 ▾'}</button><button class="btn btn-primary btn-sm" data-action="mood-open" ${c.busy?'disabled':''}>${c.open?'收合':'我有話要說'}</button></div></div>
 ${renderRaffleAnnouncements()}
 <div class="mood-window" role="button" tabindex="0" aria-pressed="${c.paused}" aria-label="按住暫停玩家留言，放開繼續"><div class="mood-track ${c.paused?'paused':''}">${items.length?`<div class="mood-group">${group}</div><div class="mood-group" aria-hidden="true">${group}</div>`:`<span>${c.loading?'正在載入心情…':'今天想說什麼？分享你的陀螺心情。'}</span>`}</div></div>

 ${c.error?`<p class="hint" role="status">${esc(c.error)} <button class="btn btn-ghost btn-sm" data-action="mood-refresh" ${c.loading||c.busy?'disabled':''}>重試</button></p>`:''}

async function handleMood(action,target){

 if(action==='mood-expand'){c.expanded=!c.expanded;render();return;}
 if(action==='mood-open'){c.open=!c.open;render();return;}
 if(action==='mood-cancel'){c.open=false;c.text='';c.operationId=null;c.error='';render();return;}
 if(action==='mood-refresh'){if(!c.loading)loadMood();return;}
 let payload;
 if(action==='mood-post'){
  if(moodLength(c.text)<1||moodLength(c.text)>30){c.error='留言請輸入 1～30 字。';render();return;}

}

// ==== Unified registration status enum (spec section 4.1) ====
// The ENTIRE system uses only these six values as the canonical registration
// status. Nothing else is ever written or compared against going forward.
const REGISTRATION_STATUS_VALUES = ["draft","scheduled","open","full","closed","cancelled"];
// REGISTRATION_STATUS_LABELS is declared once, earlier in the file (used by
// both the admin registration-settings panel and the player-facing find
// events tab), so both sides always show identical wording.
// Backward-compat map for older/synonym values that may already exist in
// previously-written data — old tournaments must never disappear just
// because an earlier version of this app (or a manual data edit) used a
// different string. "started" was Phase 1's placeholder meaning "bracket
// has been drawn", which functionally means registration is no longer open.
const REGISTRATION_STATUS_COMPAT = { upcoming:"scheduled", openingSoon:"scheduled", started:"closed" };
function normalizeRegistrationStatusValue(raw){
  if(REGISTRATION_STATUS_VALUES.includes(raw)) return raw;
  if(raw && REGISTRATION_STATUS_COMPAT[raw]) return REGISTRATION_STATUS_COMPAT[raw];
  return null;
}

// ==== Unified time parsing (spec section 4.2) ====
// Must never assume every timestamp arrives as a Firestore Timestamp object —
// this app stores registration times as plain epoch-millisecond numbers, but
// this function tolerates every shape defensively so a type mismatch can
// never silently break a whole query result. Returns epoch ms or null —
// never throws.
function normalizeDateTime(value){
  if(value==null || value==="") return null;
  if(typeof value==="number") return isFinite(value) ? value : null;
  if(value instanceof Date) return value.getTime();
  if(typeof value==="object"){
    try{
      if(typeof value.toMillis==="function") return value.toMillis();
      if(typeof value.seconds==="number") return value.seconds*1000 + Math.round((value.nanoseconds||0)/1e6);
    }catch(e){ console.warn("[normalizeDateTime] failed to parse Timestamp-like value", value, e); return null; }
    return null;
  }
  if(typeof value==="string"){
    const parsed = Date.parse(value);
    return isNaN(parsed) ? null : parsed;
  }
  return null;
}

// ==== Unified registration-status classifier (spec section 4.3) ====
// THE single function that decides a tournament's effective registration
// status, in the exact priority order specified: cancelled > closed > full >
// scheduled > open > fallback-to-stored-value. Never compares a raw stored
// string directly against a hardcoded expectation elsewhere in the codebase —
// every caller that needs "is this open/scheduled/etc" goes through here.
function registrationCountdownText(openAt,now=Date.now()){
 const remaining=Math.max(0,Math.ceil((Number(openAt)-now)/1000));if(!Number.isFinite(remaining))return '開放時間待確認';
 if(!remaining)return '時間已到，確認報名狀態中…';
 const days=Math.floor(remaining/86400),hours=Math.floor(remaining%86400/3600),minutes=Math.floor(remaining%3600/60),seconds=remaining%60;
 return '距離開放 '+(days?days+'天 ':'')+[hours,minutes,seconds].map(x=>String(x).padStart(2,'0')).join(':');
}
function renderRegistrationCountdown(code,openAt){
 const at=normalizeDateTime(openAt);if(at==null)return '';
 return `<span class="hint" data-registration-countdown="${at}" data-code="${esc(code)}">${esc(registrationCountdownText(at))}</span><span class="hint">台灣時間 ${esc(new Date(at).toLocaleString('zh-TW',{timeZone:'Asia/Taipei'}))} 開放</span>`;
}

 if(document.hidden)return;let expired=false;
 document.querySelectorAll('[data-registration-countdown]').forEach(el=>{
  const at=Number(el.getAttribute('data-registration-countdown'));el.textContent=registrationCountdownText(at);
  if(at<=Date.now()&&!el.dataset.expired){el.dataset.expired='true';expired=true;}
 });
 if(!expired)return;
 if(appPhase==='tournament-detail'&&tournamentDetailCode){tournamentDetailLoading=true;render();loadTournamentDetail(tournamentDetailCode);}

function getEffectiveRegistrationStatus(t, now){
  if(t.registrationSelection&&t.registrationSelection.status!=="open")return "closed";
  now = (now==null) ? Date.now() : now;
  if(t.registrationStatus==="cancelled" || t.eventCancelled) return "cancelled";
  if(publicTournamentRegistrationLocked(t)) return "started";
  const closeAt = normalizeDateTime(t.registrationCloseAt);
  if(closeAt!=null && now>=closeAt) return "closed";
  const openAt = normalizeDateTime(t.registrationOpenAt);
  if(openAt!=null && now<openAt) return "scheduled";
  const capacity = t.capacity;
  const confirmedCount = t.confirmedCount||0;
  if(!t.registrationSelection && capacity!=null && capacity>0 && confirmedCount>=capacity) return "full";
  if(openAt!=null && (closeAt==null || now<closeAt)) return "open";
  return normalizeRegistrationStatusValue(t.registrationStatus) || "open";
}

function findEventsSummaryLine(t){
  const pd = t.parsedData || {};
  const m = pd.meta || {};
  const phaseLabels = { waiting:"尚未開始", live:"進行中", done:"已結束" };
  // Validity gate (spec section 6): only genuinely published, non-draft,
  // non-archived, publicly-visible tournaments are eligible to appear
  // ANYWHERE on this page, regardless of category. A tournament that was
  // never actually published (e.g. local test/demo data via "載入測試名單")
  // never has publishedAt set, so it's naturally excluded here without
  // needing a separate "is this test data" flag.
  const isValid = t.visibility==='public'
    && !!t.publishedAt
    && pd.archiveStatus!=='completed';
  const effectiveStatus = getEffectiveRegistrationStatus(t);
  return { code: t.code, isValid,
    name: m.name||t.name||"未命名賽事", location: m.location||t.location||"", date: m.date||t.eventDate||"",
    regStatus: effectiveStatus, regStatusLabel: REGISTRATION_STATUS_LABELS[effectiveStatus]||"", phase: t.tournamentPhase, phaseLabel: phaseLabels[t.tournamentPhase]||"",
    openAt: normalizeDateTime(t.registrationOpenAt), closeAt: normalizeDateTime(t.registrationCloseAt), capacity: t.capacity||null, confirmedCount: t.confirmedCount||0,
    formatType: m.formatType||t.formatType||"single", drawnAt: normalizeDateTime(pd.drawnAt), updatedAt: normalizeDateTime(t.updatedAt)||0 };
}

// Assigns each valid, deduplicated (by tournament code — never by name)
// tournament to AT MOST ONE of the three display categories, using the fixed
// priority order from spec section 5: ongoing beats open-for-registration
// beats upcoming. A tournament already placed in an earlier category is
// never placed in a later one, even if it would technically also qualify.
function categorizePublicTournaments(rawList){
  const byCode = new Map();
  rawList.forEach(t=>{ if(t && t.code && !byCode.has(t.code)) byCode.set(t.code, t); }); // first occurrence wins — de-dupes by code
  const all = Array.from(byCode.values()).map(findEventsSummaryLine).filter(t=>t.isValid);
  const used = new Set();
  const ongoing = all.filter(t=>t.phase==="live" && !used.has(t.code) && (used.add(t.code),true));
  const open = all.filter(t=>!used.has(t.code) && (t.regStatus==="open"||t.regStatus==="full") && (used.add(t.code),true));
  const upcoming = all.filter(t=>!used.has(t.code) && t.regStatus==="scheduled" && (used.add(t.code),true));
  // Sorting uses stored epoch-millisecond timestamps throughout — never the
  // human-readable date STRING — so comparisons are correct regardless of
  // string formatting; the timestamps themselves were written server-side
  // relative to the tournament's own timezone at creation, so no further
  // timezone conversion is needed for a simple numeric ordering.
  ongoing.sort((a,b)=> (b.drawnAt||b.updatedAt||0) - (a.drawnAt||a.updatedAt||0)); // most recently started first
  open.sort((a,b)=> (a.closeAt||Infinity) - (b.closeAt||Infinity)); // soonest deadline first
  upcoming.sort((a,b)=> (a.openAt||Infinity) - (b.openAt||Infinity)); // soonest opening first
  return { ongoing, open, upcoming };
}

function lobbyEventStartMs(t){
  const date = t.eventDate || ((t.parsedData&&t.parsedData.meta&&t.parsedData.meta.date)||"");
  const time = t.startAt || ((t.parsedData&&t.parsedData.meta&&t.parsedData.meta.startTime)||"00:00");
  if(!date) return Infinity;
  const ms = Date.parse(`${date}T${time||"00:00"}:00+08:00`);
  return isNaN(ms) ? Infinity : ms;
}
function lobbyMyRegistration(code){
  if(!Array.isArray(myRegistrationsCache)) return null;
  return myRegistrationsCache.find(r=>r.tournamentCode===code && (r.status==="confirmed"||r.status==="waitlist"||r.status==="pending_draw")) || null;
}
function lobbySummary(raw){
  const pd = raw.parsedData || {};
  const m = pd.meta || {};
  const regStatus = getEffectiveRegistrationStatus(raw);
  const authority=raw.eventAuthority||m.eventAuthority||"official";
  const hostName=raw.hostName||raw.createdByName||raw.ownerName||m.hostName||(authority==="official"?"BXH":"玩家主辦");
  return {
    raw, code:raw.code, name:m.name||raw.name||"未命名賽事", date:m.date||raw.eventDate||"", startAt:m.startTime||raw.startAt||"",
    location:m.location||raw.location||"", phase:canonicalPublicTournamentPhase(raw), regStatus,
    authority, hostName, systemClosure:raw.systemClosure||pd.systemClosure||null,
    registrationSelection:raw.registrationSelection||null,registeredCount:Number(raw.registeredCount||0),capacity:raw.capacity||0, confirmedCount:raw.confirmedCount||0, waitlistEnabled:!!raw.waitlistEnabled,
    waitlistCapacity:raw.waitlistCapacity||0, waitlistCount:raw.waitlistCount||0,
    closeAt:normalizeDateTime(raw.registrationCloseAt), openAt:normalizeDateTime(raw.registrationOpenAt),
    cancellationDeadline:normalizeDateTime(raw.cancellationDeadline), targetGroup:raw.targetGroup||m.targetGroup||"open",
    eventCancelled:!!raw.eventCancelled, publishedAt:raw.publishedAt, visibility:raw.visibility,
    startMs:lobbyEventStartMs(raw), formatType:raw.formatType||m.formatType||"single",
    fee:raw.fee, checkInAt:raw.checkInAt||m.checkin||"", eventDescription:raw.eventDescription||""
  };
}
function lobbyLists(rawList){
  const unique = new Map();
  (rawList||[]).forEach(r=>{ if(r&&r.code&&!unique.has(r.code)) unique.set(r.code,r); });
  const all=[...unique.values()]
    .filter(r=>r.visibility==="public" && (!!r.publishedAt || r.eventAuthority==="community"))
    .map(lobbySummary)
    .filter(lobbyMatchesActiveFilters);
  const live=all.filter(t=>t.phase==="live").sort((a,b)=>a.startMs-b.startMs);
  const settling=all.filter(t=>t.phase==="settling").sort((a,b)=>b.startMs-a.startMs);
  const registration=all.filter(t=>t.phase==="waiting" && !t.eventCancelled && (t.regStatus==="open" || t.regStatus==="full")).sort((a,b)=>a.startMs-b.startMs);
  const waiting=all.filter(t=>t.phase==="waiting" && !t.eventCancelled && !(t.regStatus==="open" || t.regStatus==="full")).sort((a,b)=>a.startMs-b.startMs);
  const ended=all.filter(t=>t.phase==="done" || t.phase==="cancelled").sort((a,b)=>b.startMs-a.startMs).slice(0,5);
  return { live, settling, registration, waiting, ended, total:all.length };
}
function lobbyRegistrationButtons(t, loggedIn){

  return `<button class="btn btn-primary btn-sm" data-action="lobby-register" data-code="${esc(t.code)}" data-target-group="${esc(t.targetGroup)}">${label}</button>`;
}

function lobbyMatchesActiveFilters(t){
  const f=findEventsFilters||{keyword:"",date:"",region:"",format:"all"};

  if(region && !String(t.location||"").toLowerCase().includes(region)) return false;
  if(f.format && f.format!=="all" && t.formatType!==f.format) return false;
  return true;
}

// Renders one category section with independent expand/collapse (default 2
// items shown), its own empty-state line, and a count-aware toggle button.
function findEventsCategorySection(key, title, emptyText, list){
  if(list.length===0){
    return `<div class="fe-category"><div class="fe-category-title">${esc(title)}</div><div class="empty-state fe-empty-line">${esc(emptyText)}</div></div>`;
  }
  const expanded = !!findEventsExpanded[key];
  const shown = expanded ? list : list.slice(0,2);
  const toggle = list.length>2
    ? `<button class="btn btn-ghost btn-sm fe-toggle-btn" data-action="toggle-find-events-category" data-category="${key}">${expanded?"收合 ▲":`查看全部 ${list.length} 場 ▼`}</button>`
    : "";
  return `<div class="fe-category" id="fe-category-${key}">
    <div class="fe-category-title">${esc(title)}</div>
    ${shown.map(findEventsCardHtml).join("")}
    ${toggle}
  </div>`;
}

async function loadTournamentDetail(code){
  tournamentDetailLoading = true;
  tournamentDetailError = null;
  render();
  try{
    if(window.cloudSync && window.cloudSync.connect){ await window.cloudSync.connect(); }
    if(!cloudAvailable() || !window.cloudSync.getPublicTournamentFull){
      tournamentDetailError = PUBLIC_TOURNAMENTS_ERROR_MESSAGES.network;
      tournamentDetailLoading = false; render(); return;
    }
    const data = await window.cloudSync.getPublicTournamentFull(code);
    if(!data){ tournamentDetailError = "找不到賽事"; tournamentDetailLoading = false; render(); return; }
    tournamentDetailData = data;
    const uid = (typeof firebaseUser!=="undefined" && firebaseUser) ? firebaseUser.uid : null;
    if(uid && window.cloudSync.getMyRegistrationForTournament){
      tournamentDetailMyReg = await window.cloudSync.getMyRegistrationForTournament(code);
    } else {
      tournamentDetailMyReg = null;
    }
    tournamentDetailError = null;
  }catch(e){
    tournamentDetailError = mapRegistrationError(e);
  }
  tournamentDetailLoading = false;
  render();
}

const SMART_CALL_PREF_KEY = "bxh_smart_call_prefs_v1";
const SMART_CALL_LAST_KEY = "bxh_smart_call_last_v1";
let smartCallAutoRefreshTimer = null;
let smartCallRefreshBusy = false;
function smartCallStorageRead(key){
  try{ return JSON.parse(localStorage.getItem(key)||"{}"); }catch(e){ return {}; }
}
function smartCallStorageWrite(key,obj){
  try{ localStorage.setItem(key,JSON.stringify(obj||{})); }catch(e){}
}
function smartCallUserKey(){ return (firebaseUser&&firebaseUser.uid)||"guest"; }
function smartCallEnabled(code){
  const all=smartCallStorageRead(SMART_CALL_PREF_KEY); const u=all[smartCallUserKey()]||{}; return u[code]===true;
}
function setSmartCallEnabled(code,on){
  const all=smartCallStorageRead(SMART_CALL_PREF_KEY); const uk=smartCallUserKey(); all[uk]=all[uk]||{}; all[uk][code]=!!on; smartCallStorageWrite(SMART_CALL_PREF_KEY,all);
  if(!on){ const ls=smartCallStorageRead(SMART_CALL_LAST_KEY); if(ls[uk]) delete ls[uk][code]; smartCallStorageWrite(SMART_CALL_LAST_KEY,ls); }
}
function smartCallNorm(v){ return String(v||"").trim().toLowerCase().replace(/\s+/g,""); }
function smartCallFindPlayerId(st,r){
  if(!st||!Array.isArray(st.players)) return null;
  if(r?.familyPlayerId)return st.players.find(p=>p.id==="family_"+r.familyPlayerId||p.familyPlayerId===r.familyPlayerId)?.id||null;
  const candidates=[r&&r.displayName,r&&r.realName,r&&r.gameId,r&&r.publicName,userProfile&&userProfile.realName,userProfile&&userProfile.displayName,userProfile&&userProfile.gameId].map(smartCallNorm).filter(Boolean);
  const found=st.players.find(p=>candidates.includes(smartCallNorm(p&&p.name)));
  return found ? found.id : null;
}
function smartCallPlayerName(st,id){ const p=st&&Array.isArray(st.players)?st.players.find(x=>x.id===id):null; return p&&p.name?p.name:"待定"; }
function smartCallRemainingSeconds(m){
  if(!m) return 180;
  if(m.completed) return 0;
  const a=Number(m.scoreA||0), b=Number(m.scoreB||0), hi=Math.max(a,b), total=a+b;
  if(m.status!=="in_progress") return 180;
  if(hi>=3) return 45;          // 3 分賽點：任一有效得分很可能直接結束
  if(hi>=2 || total>=3) return 80;
  if(hi>=1 || total>=1) return 120;
  return 165;
}
function smartCallModel(r,info){
  const st=info&&info.parsedData;
  if(!st || !Array.isArray(st.matches) || !Array.isArray(st.players)) return {kind:"pending",message:"等待賽事對戰資料同步"};
  if(r.status!=="confirmed") return {kind:"waitlist",message:"目前為備取，遞補為正取後才會啟用叫號"};
  const pid=smartCallFindPlayerId(st,r);
  if(!pid) return {kind:"pending",message:st.startedAt?"尚未在目前對戰表找到你的出賽位置":"等待主辦完成對戰編排"};
  const livePhase=(info.tournamentPhase==="live") || !!st.startedAt;
  if(!livePhase) return {kind:"waiting",message:"等待賽事開始",playerId:pid};
  const matches=st.matches.filter(m=>m && !m.isBye && !m.completed);
  const mine=matches.filter(m=>(m.a&&m.a.playerId===pid)||(m.b&&m.b.playerId===pid)).sort((a,b)=>Number(a.seq||0)-Number(b.seq||0));
  const currentMine=mine.find(m=>m.status==="in_progress" || Object.values(st.courtAssignments||{}).some(c=>c&&c.currentMatchId===m.id));
  if(currentMine){
    const opp=(currentMine.a&&currentMine.a.playerId===pid)?(currentMine.b&&currentMine.b.playerId):(currentMine.a&&currentMine.a.playerId);
    return {kind:"playing",ahead:0,station:currentMine.station||1,opponent:smartCallPlayerName(st,opp),etaSec:0,message:"正在進行你的對戰"};
  }
  const target=mine[0];
  if(!target){
    const hadLoss=(st.matches||[]).some(m=>m&&m.completed&&m.loserId===pid);
    if(info.tournamentPhase==="done" || st.archiveStatus==="completed") return {kind:"done",message:"本場賽程已完成"};
    if(hadLoss && (st.meta&&st.meta.formatType)==="single") return {kind:"done",message:"本場個人賽程已結束"};
    return {kind:"pending",message:"下一輪對戰組合尚未產生"};
  }
  if(!target.a || !target.b || !target.a.playerId || !target.b.playerId) return {kind:"pending",station:target.station||1,message:"下一輪對手尚未確定"};
  const station=target.station||1;
  const queue=courtCallPublicQueue(st,station);
  let idx=queue.findIndex(m=>m.id===target.id); if(idx<0) idx=0;
  let eta=0; for(let i=0;i<idx;i++) eta+=smartCallRemainingSeconds(queue[i]);
  const opp=(target.a.playerId===pid)?target.b.playerId:target.a.playerId;
  const kind=idx<=1?"soon":idx<=3?"prepare":"waiting";
  return {kind,ahead:idx,station,opponent:smartCallPlayerName(st,opp),etaSec:eta,message:idx===0?"下一場就是你":"前方還有 "+idx+" 場"};
}
function smartCallEtaText(sec){
  if(sec==null) return "—"; if(sec<=30) return "即將上場";
  const min=Math.max(1,Math.round(sec/60)); const lo=Math.max(1,min-1), hi=min+1; return lo===hi?`約 ${min} 分鐘`:`約 ${lo}～${hi} 分鐘`;
}
function smartCallMaybeNotify(code,model){
  if(!smartCallEnabled(code) || !model || typeof model.ahead!=="number") return;
  const all=smartCallStorageRead(SMART_CALL_LAST_KEY), uk=smartCallUserKey(); all[uk]=all[uk]||{}; const prev=all[uk][code]||{};
  let level=0; if(model.kind==="playing") level=3; else if(model.ahead<=1) level=2; else if(model.ahead<=3) level=1;
  if(level>Number(prev.level||0)){
    let msg="";
    if(level===1) msg=`BXH CALL｜前方剩 ${model.ahead} 場，${smartCallEtaText(model.etaSec)}`;
    if(level===2) msg=`BXH CALL｜下一場就是你，請前往 Court ${model.station||1} 準備`;
    if(level===3) msg=`BXH CALL｜輪到你了｜Court ${model.station||1}`;
    if(msg){ showToast(msg); try{ if(navigator.vibrate) navigator.vibrate(level>=2?[180,80,180]:120); }catch(e){} }
    all[uk][code]={level,at:Date.now()}; smartCallStorageWrite(SMART_CALL_LAST_KEY,all);
  }
}
function smartCallCardHtml(r,info){

function scheduleSmartCallAutoRefresh(){
  if(smartCallAutoRefreshTimer){ clearTimeout(smartCallAutoRefreshTimer); smartCallAutoRefreshTimer=null; }
  if(appPhase!=="player-center" || playerActiveTab!=="registered" || !Array.isArray(myRegistrationsCache)) return;
  const enabled=myRegistrationsCache.filter(r=>r.status==="confirmed"&&schedulePhase(myRegistrationsTournamentInfo[r.tournamentCode]||{})==='live'&&smartCallModel(r,myRegistrationsTournamentInfo[r.tournamentCode]||{}).kind!=='done'&&smartCallEnabled(r.tournamentCode)); if(!enabled.length) return;
  smartCallAutoRefreshTimer=setTimeout(async()=>{
    if(smartCallRefreshBusy || appPhase!=="player-center" || playerActiveTab!=="registered") return;
    smartCallRefreshBusy=true;
    try{
      for(const r of enabled){ try{ const info=await window.cloudSync.getPublicTournamentSummary(r.tournamentCode); if(info) myRegistrationsTournamentInfo[r.tournamentCode]=info; }catch(e){} }
    }finally{ smartCallRefreshBusy=false; if(appPhase==="player-center"&&playerActiveTab==="registered"){ renderPreservingScroll(); } }
  },20000);
}

function legacyGameIdFromProfile(p){

function profileCompletionPercent(p){
  if(!p) return 0;

    !!effectiveGameId(p),
    !!(p.phone&&String(p.phone).trim()),

    !!(p.gender&&String(p.gender).trim()),

    !!p.avatarUrl

  return Math.round(checks.filter(Boolean).length/checks.length*100);
}

async function fileToPlayerAvatarDataUrl(file){
  if(!file || !file.type || !file.type.startsWith("image/")) throw new Error("invalid-file");
  if(file.size > 10 * 1024 * 1024) throw new Error("file-too-large");

  const bitmap = await new Promise((resolve,reject)=>{
    const reader=new FileReader();
    reader.onload=()=>{
      const img=new Image();
      img.onload=()=>resolve(img);
      img.onerror=reject;
      img.src=reader.result;
    };
    reader.onerror=reject;
    reader.readAsDataURL(file);
  });

  const side=Math.min(bitmap.naturalWidth||bitmap.width, bitmap.naturalHeight||bitmap.height);
  const sx=((bitmap.naturalWidth||bitmap.width)-side)/2;
  const sy=((bitmap.naturalHeight||bitmap.height)-side)/2;
  const canvas=document.createElement("canvas");
  canvas.width=256; canvas.height=256;
  const ctx=canvas.getContext("2d");
  ctx.drawImage(bitmap,sx,sy,side,side,0,0,256,256);
  return canvas.toDataURL("image/jpeg",0.82);
}

async function copyTextToClipboard(text, successMessage){
  try{
    if(navigator.clipboard && navigator.clipboard.writeText){
      await navigator.clipboard.writeText(text);
      showToast(successMessage);
      return true;
    }
    throw new Error("no clipboard api");
  }catch(e){
    try{
      const ta = document.createElement("textarea");
      ta.value = text;
      ta.style.position="fixed"; ta.style.opacity="0";
      document.body.appendChild(ta);
      ta.select();
      document.execCommand("copy");
      ta.remove();
      showToast(successMessage);
      return true;
    }catch(e2){
      showToast("複製失敗，請手動選取文字複製", true);
      return false;
    }
  }
}

function matchResultSummaryText(m){
  if(!m || !m.winnerId) return "";
  const winName = playerName(m.winnerId);
  if(m.resultMethod==="quick_decision"){
    return winName + " 勝";
  }
  const loserName = m.loserId ? playerName(m.loserId) : "";
  const winScore = (m.a && m.a.playerId===m.winnerId) ? m.scoreA : m.scoreB;
  const loseScore = (m.a && m.a.playerId===m.winnerId) ? m.scoreB : m.scoreA;
  return winName + " " + winScore + "：" + loseScore + " " + loserName;
}

    if(__fxTimer2){ clearTimeout(__fxTimer2); __fxTimer2=null; }
    const fx = document.getElementById("celebration-fx");

}

function playFireworks(){
  try{
    clearFireworks();
    const fx = document.getElementById("celebration-fx");
    if(!fx) return;
    const reduced = (typeof window!=="undefined" && window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches);
    const isMobile = (typeof window!=="undefined" && window.innerWidth && window.innerWidth<640);
    const colors = ["#D4AF37","#F3D98B","#F7F2E8","#8A6428","#2A090D"];
    let html = "";
    if(reduced){
      const dotCount = isMobile ? 10 : 18;
      for(let i=0;i<dotCount;i++){
        const x = Math.random()*100, y = 10+Math.random()*70;
        html += `<div class="fw-static" style="left:${x}%;top:${y}%;background:${colors[i%colors.length]};"></div>`;
      }
      fx.innerHTML = html;
      return;
    }
    const origins = isMobile
      ? [{x:6,y:28},{x:94,y:28},{x:10,y:55},{x:90,y:55}]
      : [{x:6,y:22},{x:12,y:48},{x:94,y:22},{x:88,y:48},{x:20,y:10},{x:80,y:10}];
    let idx=0;
    origins.forEach((origin, oi)=>{
      const particleCount = isMobile ? 8 : 12;
      for(let i=0;i<particleCount;i++){
        const angle = (Math.PI*2*i)/particleCount + Math.random()*0.4;
        const dist = 55 + Math.random()*65;
        const dx = Math.cos(angle)*dist;
        const dy = Math.sin(angle)*dist;
        const color = (idx % 8===7) ? colors[4] : colors[idx % 4]; idx++;
        const delay = (oi*0.4 + Math.random()*0.3).toFixed(2);
        html += `<div class="fw-particle" style="left:${origin.x}%;top:${origin.y}%;background:${color};color:${color};--dx:${dx}px;--dy:${dy}px;animation-delay:${delay}s;"></div>`;
      }
    });
    const confettiCount = isMobile ? 10 : 22;
    for(let i=0;i<confettiCount;i++){
      const x = Math.random()*100;
      const color = (i % 9===8) ? colors[4] : colors[i % 4];
      const delay = (1.2 + Math.random()*2.4).toFixed(2);
      html += `<div class="fw-confetti" style="left:${x}%;top:-20px;background:${color};animation-delay:${delay}s;"></div>`;
    }
    fx.innerHTML = html;
    __fxTimer = setTimeout(()=>{
      const fx2 = document.getElementById("celebration-fx");
      if(fx2) fx2.innerHTML = "";
    }, 8000);
  }catch(e){ /* no-op outside a real browser DOM */ }
}

// v13.19.2: generic confirmation modal must sit above admin tournament-list/switch overlays.

function renderModal(){
  if(!pendingModal) return "";
  const mm = pendingModal;
  let body = mm.messageIsHtml ? `<div class="modal-rich-content">${mm.message||""}</div>` : `<p>${esc(mm.message).replace(/\n/g,"<br>")}</p>`;
  mm.confirmDisabled = false;
  if(mm.type==="confirm-result"){
    const m = getMatch(mm.matchId);
    if(!m || !m.a || !m.b){
      body = `<p>此對戰資料異常，無法確認結果。</p>`;
      mm.confirmDisabled = true;
    } else if(m.completed || m.status==="completed"){
      body = `<p>此場比賽已完成確認。</p>`;
      mm.confirmDisabled = true;
    } else {
      const aName = playerName(m.a.playerId), bName = playerName(m.b.playerId);
      // Winner side is recomputed fresh on every render, straight from the live score.
      // There is no clickable selection here — nothing in this modal can change winnerId.
      const winSide = checkWinnerSide(m);
      if(!winSide){
        const tieMsg = (m.scoreA===m.scoreB) ? "目前比分相同，無法確認獲勝者。" : "比分尚未達到獲勝條件，請重新確認。";
        body = `<p class="result-invalid-msg">${esc(tieMsg)}</p>
        <div class="radio-row">
          <div class="radio-opt result-locked">${esc(aName)}<br><span style="font-size:12px;color:var(--metal)">${m.scoreA} 分</span></div>
          <div class="radio-opt result-locked">${esc(bName)}<br><span style="font-size:12px;color:var(--metal)">${m.scoreB} 分</span></div>
        </div>`;
        mm.confirmDisabled = true;
      } else {
        const aWins = winSide==="A";
        const winName = aWins ? aName : bName, winScore = aWins ? m.scoreA : m.scoreB;
        const loseName = aWins ? bName : aName, loseScore = aWins ? m.scoreB : m.scoreA;
        body = `<p>系統已依目前比分判定本場獲勝者，請確認比分無誤。</p>
        <div class="radio-row">
          <div class="radio-opt result-winner" aria-disabled="false">
            <span class="result-crown">${WINNER_CROWN_SVG}</span><br>
            ${esc(winName)}<br><span style="font-size:12px;">${winScore} 分</span><br>
            <span class="result-tag result-tag-win">系統判定獲勝</span>
          </div>
        </div>`;
        mm.confirmDisabled = false;
      }
    }
  }
  if(mm.type==="confirm-quick"){
    const m = getMatch(mm.matchId);
    if(!m || !m.a || !m.b){
      body = `<p>此對戰資料異常，無法確認結果。</p>`;
      mm.confirmDisabled = true;
    } else if(m.completed || m.status==="completed" || m.winnerId){
      body = `<p>本場比賽已完成判定。</p>`;
      mm.confirmDisabled = true;
    } else if(mm.selectedWinnerId!==m.a.playerId && mm.selectedWinnerId!==m.b.playerId){
      body = `<p>賽事資料已變更或不符合判定條件，請重新確認。</p>`;
      mm.confirmDisabled = true;
    } else {
      const aWins = mm.selectedWinnerId===m.a.playerId;
      const winName = aWins ? playerName(m.a.playerId) : playerName(m.b.playerId);
      const loseName = aWins ? playerName(m.b.playerId) : playerName(m.a.playerId);
      body = `<p class="quick-confirm-meta">比賽輪次：${refereeStageLabel(m)} · 第 ${m.indexInRound+1} 場　比賽台：台${m.station}</p>
      <div class="radio-row quick-winner-row">
        <div class="radio-opt result-winner quick-winner-card" aria-disabled="false">
          <span class="result-crown quick-winner-crown">${WINNER_CROWN_SVG}</span>
          <span class="quick-winner-name">${esc(winName)}</span>
          <span class="result-tag result-tag-win quick-winner-tag">本場獲勝</span>
        </div>
      </div>
      <p class="hint quick-confirm-note">簡易判定模式不記錄比分。確認後，獲勝選手將直接晉級下一輪。</p>`;
      mm.confirmDisabled = false;
    }
  }
  if(mm.type==="reauth-unarchive"){
    body = `<p>此賽事已封存為歷史紀錄。更正歷史結果需要重新確認您的身分。</p>
    ${mm.error ? `<div class="auth-error">${esc(mm.error)}</div>` : ""}
    <div class="field"><label>請再次輸入登入密碼</label><input type="password" id="reauth-password-input" autocomplete="current-password"></div>
    <p class="hint" style="margin-top:6px;">驗證成功後，此次操作會記錄修改前的名次資料、修改者與修改時間。</p>`;
    mm.confirmDisabled = false;
  }
  return `<div class="modal-overlay confirmation-overlay" data-action="modal-overlay" role="dialog" aria-modal="true">
    <div class="modal-box ${mm.type==="confirm-quick"?"quick-confirm-modal":""}">
      <h3>${esc(mm.title)}</h3>
      ${body}
      <div class="btn-row ${(mm.type==="confirm-result"||mm.type==="confirm-quick")?"result-confirm-actions":""}">
        <button id="modal-cancel-btn" class="btn btn-ghost btn-block" data-action="modal-cancel" type="button">${esc(mm.cancelLabel||"取消")}</button>
        <button id="modal-confirm-btn" class="btn ${mm.danger?'btn-danger-solid':'btn-primary'} btn-block" data-action="modal-confirm" type="button" ${(mm.confirmDisabled||mm.confirmBusy)?'disabled':''}>${mm.confirmBusy?'處理中……':esc(mm.confirmLabel||"確認")}</button>
      </div>
    </div>
  </div>`;
}

function historyCloudIdentityKey(){
  return JSON.stringify([currentAuthUid(), currentRole,
    userProfile && userProfile.role, userProfile && userProfile.active,
    engagementSessionEpoch]);
}
function isHistoryCloudView(){
  return appPhase==="app" && activeTab==="history" && hasAdminAccess();
}
function cancelHistoryCloudSync(){
  const request=historyCloudSyncRequest;
  historyCloudSyncRequest=null;
  historyCloudSyncBusy=false;
  if(request) request.cancel();
}
function reconcileHistoryCloudContext(){
  const key=historyCloudIdentityKey();
  const visible=isHistoryCloudView();
  if(key!==historyCloudSyncContextKey){
    cancelHistoryCloudSync();
    // Remove only records imported into this session, not locally authored records.
    recordIndex=recordIndex.filter(r=>!historyCloudRecordCache.has(r.id));
    historyCloudRecordCache.clear();
    viewingRecordId=null; viewingRecordData=null;
    historyCloudSyncLoaded=false; historyCloudSyncError="";
    historyCloudSyncContextKey=key;
  }else if(historyCloudViewActive && !visible){
    cancelHistoryCloudSync();
    historyCloudSyncLoaded=false;
    historyCloudSyncError="";
  }
  historyCloudViewActive=visible;
}
async function syncCompletedCloudRecordsToHistory(force){
  reconcileHistoryCloudContext();
  if(!isHistoryCloudView() || historyCloudSyncBusy) return;
  if(historyCloudSyncLoaded && !force) return;

  // This is an attempt latch, including failure. Rendering is never a retry policy.
  historyCloudSyncLoaded=true;
  historyCloudSyncBusy=true;
  historyCloudSyncError="";
  const request={key:historyCloudIdentityKey(),cancel:()=>{}};
  historyCloudSyncRequest=request;
  const current=()=>historyCloudSyncRequest===request && request.key===historyCloudIdentityKey() && isHistoryCloudView();
  const cancelled=()=>Object.assign(new Error("history-cancelled"),{code:"history-cancelled"});
  const check=()=>{if(!current()) throw cancelled();};
  let timer;
  const stop=new Promise((resolve,reject)=>{
    request.cancel=()=>reject(cancelled());
    timer=setTimeout(()=>reject(Object.assign(new Error("history-timeout"),{code:"history-timeout"})),HISTORY_CLOUD_TIMEOUT_MS);
  });
  render();
  try{
    const result=await Promise.race([(async()=>{
      if(window.cloudSync && window.cloudSync.connect) await window.cloudSync.connect();
      check();
      if(!cloudAvailable()) throw new Error("cloud-unavailable");
      const summaries=await window.cloudSync.queryAdminTournaments();
      check();
      const completed=(Array.isArray(summaries)?summaries:[]).filter(t=>t.archiveStatus==="completed" || t.tournamentPhase==="done");
      const records=[],cloudSummaries=[];
      let failedCount=0;
      for(const item of completed){
        check();
        try{
          const response=await window.cloudSync.joinRoom(item.code);
          check();
          if(!response || !response.ok || !response.data){failedCount++;continue;}
          const rec=Object.assign(defaultState(response.data.id),response.data);
          rec.cloudCode=item.code;
          rec.archiveStatus="completed";
          if(!rec.completedAt) rec.completedAt=item.updatedAt || Date.now();
          if(!rec.archivedAt) rec.archivedAt=rec.completedAt;
          records.push(rec); cloudSummaries.push(summarizeRecord(rec));
        }catch(e){
          check();
          failedCount++;
          console.warn("[history sync] record unavailable",item.code,e);
        }
      }
      const localIndex=await loadIndex();
      check();
      return {records,cloudSummaries,localIndex,failedCount,total:completed.length};
    })(),stop]);
    check();
    // Stage first, commit once. Late responses cannot write the UI or local storage.
    const merged=new Map();
    (Array.isArray(result.localIndex)?result.localIndex:[]).forEach(r=>merged.set(r.id,r));
    historyCloudRecordCache.clear();
    result.records.forEach(rec=>historyCloudRecordCache.set(rec.id,rec));
    result.cloudSummaries.forEach(r=>merged.set(r.id,r));
    recordIndex=Array.from(merged.values());
    if(result.failedCount){
      historyCloudSyncError=`已同步 ${result.records.length} 場賽事；另有 ${result.failedCount} 場讀取失敗。請確認權限或稍後按「重新同步雲端紀錄」。`;
    }
  }catch(e){
    if(!current()) return;
    console.warn("[history sync] failed",e);
    historyCloudSyncError=e && e.code==="permission-denied"
      ? "目前帳號沒有讀取雲端歷史賽事的權限。可切換其他分頁；權限確認後再按「重新同步雲端紀錄」。"
      : e && e.code==="history-timeout"
        ? "雲端紀錄同步逾時，已停止等待。請確認網路後按「重新同步雲端紀錄」。"
        : "雲端賽事紀錄同步失敗。請確認網路後按「重新同步雲端紀錄」，或先切換其他分頁。";
  }finally{
    clearTimeout(timer);
    if(historyCloudSyncRequest===request){
      historyCloudSyncRequest=null;
      historyCloudSyncBusy=false;
      if(request.key===historyCloudIdentityKey() && isHistoryCloudView()) render();
    }
  }
}

// v13.23.5: full-innerHTML renders used to collapse the document for a moment and
// clamp window.scrollY back to 0. Preserve the viewport only when the user remains
// in the SAME logical screen. Navigation to a different tab/room/tournament still
// starts naturally instead of inheriting an unrelated old scroll position.
let __lastRenderedViewportKey = null;
let __viewportRestoreToken = 0;
function currentRenderViewportKey(){
  const safe = (v)=> (v==null ? "" : String(v));
  return [
    safe(appPhase),
    safe(appPhase==="account-management"?superAdminManagementPage:""),
    safe(appPhase==="account-management"&&superAdminManagementPage==="titles"?titleManagementContext().tab:""),

    safe(typeof guestActiveTab!=="undefined" ? guestActiveTab : ""),

    safe(state && (state.cloudCode || state.id || ""))
  ].join("|");
}
function captureHorizontalNavPositions(){
  if(typeof document==="undefined") return {};
  const out={};
  const selectors={
    adminTabs:"nav.tabs",
    playerTabs:".stickytop .player-tabs:not(.player-tabs-bottom)",
    guestTabs:".guest-tabs"
  };
  Object.entries(selectors).forEach(([key,sel])=>{
    const el=document.querySelector(sel);
    if(el) out[key]=Number(el.scrollLeft||0);
  });
  return out;
}
function restoreHorizontalNavPositions(positions){
  if(!positions || typeof document==="undefined") return;
  const selectors={
    adminTabs:"nav.tabs",
    playerTabs:".stickytop .player-tabs:not(.player-tabs-bottom)",
    guestTabs:".guest-tabs"
  };
  Object.entries(selectors).forEach(([key,sel])=>{
    if(!(key in positions)) return;
    const el=document.querySelector(sel);
    if(!el) return;
    try{ el.scrollLeft=Number(positions[key]||0); }catch(e){}
  });
}

function captureRenderViewport(){
  const key = currentRenderViewportKey();
  const canReadWindow = typeof window!=="undefined";
  return {
    key,
    preserve: __lastRenderedViewportKey!==null && __lastRenderedViewportKey===key,
    x: canReadWindow ? (window.scrollX || 0) : 0,
    y: canReadWindow ? (window.scrollY || 0) : 0,
    navScroll: captureHorizontalNavPositions()
  };
}
function finishRenderViewport(snapshot){
  if(!snapshot) return;
  __lastRenderedViewportKey = snapshot.key;
  if(typeof window==="undefined") return;

  const token = ++__viewportRestoreToken;
  const restoreNav = ()=>{
    if(token!==__viewportRestoreToken) return;
    restoreHorizontalNavPositions(snapshot.navScroll);
  };
  const restorePage = ()=>{
    if(token!==__viewportRestoreToken) return;
    if(!snapshot.preserve || !window.scrollTo) return;
    if(currentRenderViewportKey()!==snapshot.key) return;
    try{ window.scrollTo(snapshot.x, snapshot.y); }catch(e){}
  };
  const restore = ()=>{ restoreNav(); restorePage(); };

  // Navigation scrollLeft is restored even when the active tab changes. Page
  // scrollY is restored only for the same view key. This separates BUG 006
  // (horizontal tab position) from v13.23.5's page-scroll preservation.
  restore();
  const raf = (typeof requestAnimationFrame==="function") ? requestAnimationFrame : (fn)=>setTimeout(fn,16);
  raf(()=>{ restore(); raf(restore); });
  setTimeout(restore, 80);
  setTimeout(restore, 180);
}

function positionAccountMenuOverlay(){
  if(!accountMenuOpen) return;
  const badge=document.querySelector(".account-badge");
  const menu=document.querySelector(".account-menu-overlay .account-menu");
  if(!badge || !menu || typeof window==="undefined") return;
  const rect=badge.getBoundingClientRect();
  const vw=Math.max(document.documentElement.clientWidth||0,window.innerWidth||0);
  const margin=12;
  const preferredWidth=Math.max(190,Math.min(280,rect.width+46));
  const width=Math.min(preferredWidth,Math.max(180,vw-margin*2));
  const left=Math.min(Math.max(margin,rect.right-width),Math.max(margin,vw-width-margin));
  const top=Math.max(margin,rect.bottom+8);
  menu.style.width=width+"px";
  menu.style.left=left+"px";
  menu.style.top=top+"px";
  menu.style.right="auto";
}
