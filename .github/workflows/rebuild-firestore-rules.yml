name: Rebuild Firestore rules

# manual recovery trigger
on:
  push:
    paths:
      - '.github/workflows/rebuild-firestore-rules.yml'
      - '.rules_chunks/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rebuild exact Firestore rules file
        shell: bash
        run: |
          set -euo pipefail
          cat .rules_chunks/part*.b64 | tr -d '\n\r' | base64 --decode > firestore.rules
          echo "Generated bytes: $(wc -c < firestore.rules)"
          echo "Generated sha256: $(sha256sum firestore.rules | awk '{print $1}')"
          test "$(wc -c < firestore.rules)" -eq 64612
          echo "138729ce9169d76b8d20239e9954fc4d3597d0c2fc561d181dc9a694392a0c46  firestore.rules" | sha256sum -c -

      - name: Commit reconstructed rules
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add firestore.rules
          if git diff --cached --quiet; then
            echo "firestore.rules already matches source"
            exit 0
          fi
          git commit -m "Add Beta Firestore rules from production v13.29.10"
          git push
