name: Apply Challonge single-elimination order

on:
  push:
    branches:
      - fix/challonge-single-elim-order-20260918
    paths:
      - .github/workflows/apply-challonge-order.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply verified patch
        shell: bash
        env:
          PATCH_B64: 
        run: |
          set -euo pipefail
          printf '%s' "$PATCH_B64" | base64 --decode > /tmp/challonge-order.patch
          git apply --check /tmp/challonge-order.patch
          git apply /tmp/challonge-order.patch
      - name: Run bracket regression tests
        shell: bash
        run: |
          set -euo pipefail
          node tests/challonge-single-elim-order.cjs
          node tests/tournament-regression.cjs
          node tests/court-call.cjs
          node tests/referee-view.cjs
          git diff --check
      - name: Commit patch and remove one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/apply-challonge-order.yml
          git add index.html tests/challonge-single-elim-order.cjs tests/court-call.cjs
          git add -u .github/workflows/apply-challonge-order.yml
          git commit -m "fix: adopt Challonge-style single-elimination order"
          git push
