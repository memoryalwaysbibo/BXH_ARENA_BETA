name: Bootstrap BXH ARENA Beta

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bootstrap-beta.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout beta repository
        uses: actions/checkout@v4

      - name: Copy current stable frontend
        run: |
          curl -fL --retry 3 \
            https://raw.githubusercontent.com/memoryalwaysbibo/BXH_ARENA/main/index.html \
            -o index.html

      - name: Add beta environment marker
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          marker = '''\n<div id="bxh-beta-environment-banner" style="position:fixed;top:0;left:0;right:0;z-index:2147483647;background:#b91c1c;color:#fff;text-align:center;font:700 12px/28px system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;letter-spacing:.08em;box-shadow:0 1px 8px rgba(0,0,0,.35);pointer-events:none">BETA 測試站｜非正式環境</div>\n<style id="bxh-beta-environment-style">body{padding-top:28px!important}</style>\n'''
          if 'bxh-beta-environment-banner' not in s:
              lower = s.lower()
              pos = lower.find('<body')
              if pos >= 0:
                  end = s.find('>', pos)
                  s = s[:end+1] + marker + s[end+1:]
              else:
                  s = marker + s
          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit beta baseline
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Bootstrap beta from current stable frontend"
            git push
          fi