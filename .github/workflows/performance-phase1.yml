name: Phase 1 performance regression
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'sw.js'
      - 'tests/performance-phase1.cjs'
      - 'tests/firebase-module-syntax.cjs'
      - 'tests/classic-script-syntax.cjs'
      - 'tests/smart-call-default.cjs'
      - 'tests/lobby-sort.cjs'
      - 'tests/navigation-language.cjs'
      - 'tests/button-hierarchy.cjs'
      - 'tests/lobby-navigation.cjs'
      - '.github/workflows/performance-phase1.yml'
permissions:
  contents: read
jobs:
  stress:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check classic inline JavaScript syntax
        run: node tests/classic-script-syntax.cjs
      - name: Check Firebase module JavaScript syntax
        run: node tests/firebase-module-syntax.cjs
      - name: Check BXH CALL default-on preference
        run: node tests/smart-call-default.cjs
      - name: Check lobby newest-first ordering
        run: node tests/lobby-sort.cjs
      - name: Check global navigation language
        run: node tests/navigation-language.cjs
      - name: Check button hierarchy
        run: node tests/button-hierarchy.cjs
      - name: Check lobby navigation semantics
        run: node tests/lobby-navigation.cjs
      - name: Run 16/32/64-client snapshot coalescing stress test
        run: node tests/performance-phase1.cjs
