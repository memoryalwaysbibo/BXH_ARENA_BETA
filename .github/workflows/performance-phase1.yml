name: Phase 1 performance regression
# Mobile auth reconnect regression included.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'activity-points-ui.js'
      - 'family-ui.js'
      - 'raffle-ui.js'
      - 'raffle-claims-ui.js'
      - 'registration-invitations-ui.js'
      - 'sw.js'
      - 'tests/performance-phase1.cjs'
      - 'tests/performance-phase2.cjs'
      - 'tests/activity-points-performance.cjs'
      - 'tests/auth-reliability.cjs'
      - 'tests/modal-watchdogs.cjs'
      - 'tests/registration-invitations-performance.cjs'
      - 'tests/firebase-module-syntax.cjs'
      - 'tests/classic-script-syntax.cjs'
      - 'tests/smart-call-default.cjs'
      - 'tests/lobby-sort.cjs'
      - 'tests/navigation-language.cjs'
      - 'tests/button-hierarchy.cjs'
      - 'tests/lobby-navigation.cjs'
      - 'tests/player-top-nav.cjs'
      - 'tests/profile-location.cjs'
      - '.github/workflows/performance-phase1.yml'
permissions:
  contents: read
jobs:
  stress:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check classic inline JavaScript syntax
        run: node tests/classic-script-syntax.cjs
      - name: Check Firebase module JavaScript syntax
        run: node tests/firebase-module-syntax.cjs
      - name: Check BXH CALL default-on preference
        run: node tests/smart-call-default.cjs
      - name: Check lobby newest-first ordering
        run: node tests/lobby-sort.cjs
      - name: Check global navigation language
        run: node tests/navigation-language.cjs
      - name: Check button hierarchy
        run: node tests/button-hierarchy.cjs
      - name: Check lobby navigation semantics
        run: node tests/lobby-navigation.cjs
      - name: Check narrow player top navigation
        run: node tests/player-top-nav.cjs
      - name: Check profile city and district selectors
        run: node tests/profile-location.cjs
      - name: Check Phase 2 read de-duplication
        run: node tests/performance-phase2.cjs
      - name: Check invitation background polling
        run: node tests/registration-invitations-performance.cjs
      - name: Check activity points retry backoff
        run: node tests/activity-points-performance.cjs
      - name: Check mobile auth reliability
        run: node tests/auth-reliability.cjs
      - name: Check background modal watchdogs
        run: node tests/modal-watchdogs.cjs
      - name: Run 16/32/64/96/128-client snapshot coalescing stress test
        run: node tests/performance-phase1.cjs
