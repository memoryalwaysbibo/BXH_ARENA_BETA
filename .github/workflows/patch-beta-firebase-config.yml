name: Patch Beta Firebase Config

on:
  push:
    paths:
      - '.github/workflows/patch-beta-firebase-config.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Beta repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch Firebase web config to Beta project
        shell: python
        run: |
          from pathlib import Path
          import re

          p = Path('index.html')
          text = p.read_text(encoding='utf-8')

          # Find a firebaseConfig object and update only its standard Web SDK fields.
          m = re.search(r'(const\s+firebaseConfig\s*=\s*\{)(.*?)(\}\s*;)', text, flags=re.S)
          if not m:
              raise SystemExit('firebaseConfig object not found')

          body = m.group(2)
          replacements = {
              'apiKey': 'AIzaSyBYyfPew1Ukf_ECSv5dqcqJbVvKpVLrnnc',
              'authDomain': 'bxh-arena-beta.firebaseapp.com',
              'projectId': 'bxh-arena-beta',
              'storageBucket': 'bxh-arena-beta.firebasestorage.app',
              'messagingSenderId': '22424096074',
              'appId': '1:22424096074:web:74afa050d5266ab09185b3',
          }

          for key, value in replacements.items():
              pattern = rf'({re.escape(key)}\s*:\s*)["\'][^"\']*["\']'
              body, n = re.subn(pattern, rf'\1"{value}"', body, count=1)
              if n != 1:
                  raise SystemExit(f'Expected exactly one {key} field in firebaseConfig, found {n}')

          updated = text[:m.start(2)] + body + text[m.end(2):]

          # Safety guards: ensure the selected config points to Beta and not production.
          check = re.search(r'const\s+firebaseConfig\s*=\s*\{(.*?)\}\s*;', updated, flags=re.S)
          assert check and 'projectId: "bxh-arena-beta"' in check.group(1)
          assert 'authDomain: "bxh-arena-beta.firebaseapp.com"' in check.group(1)

          p.write_text(updated, encoding='utf-8')
          print('Beta Firebase config patched successfully.')

      - name: Commit Beta config patch
        shell: bash
        run: |
          if git diff --quiet -- index.html; then
            echo "No index.html changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Point Beta frontend to bxh-arena-beta Firebase"
          git push
