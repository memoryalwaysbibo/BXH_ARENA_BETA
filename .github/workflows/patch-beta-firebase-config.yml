name: Patch Beta Firebase Config

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Beta repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch Firebase web config to Beta project
        shell: python
        run: |
          from pathlib import Path
          import re

          p = Path('index.html')
          text = p.read_text(encoding='utf-8')

          replacements = {
              'apiKey': 'AIzaSyBYyfPew1Ukf_ECSv5dqcqJbVvKpVLrnnc',
              'authDomain': 'bxh-arena-beta.firebaseapp.com',
              'projectId': 'bxh-arena-beta',
              'storageBucket': 'bxh-arena-beta.firebasestorage.app',
              'messagingSenderId': '22424096074',
              'appId': '1:22424096074:web:74afa050d5266ab09185b3',
          }

          updated = text
          for key, value in replacements.items():
              pattern = rf'({re.escape(key)}\s*:\s*)["\'][^"\']*["\']'
              updated, n = re.subn(pattern, rf'\1"{value}"', updated)
              if n < 1:
                  raise SystemExit(f'Firebase field not found: {key}')
              print(f'{key}: replaced {n} occurrence(s)')

          # Safety: all project IDs in Firebase config-like fields must now be Beta.
          project_ids = re.findall(r'projectId\s*:\s*["\']([^"\']+)["\']', updated)
          if not project_ids or any(v != 'bxh-arena-beta' for v in project_ids):
              raise SystemExit(f'Unsafe projectId values remain: {project_ids}')
          if 'bxh-arena-beta.firebaseapp.com' not in updated:
              raise SystemExit('Beta authDomain missing after patch')

          p.write_text(updated, encoding='utf-8')
          print('Beta Firebase fields patched successfully.')

      - name: Commit Beta config patch
        shell: bash
        run: |
          if git diff --quiet -- index.html; then
            echo "No index.html changes detected."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Point Beta frontend to bxh-arena-beta Firebase"
          git push
