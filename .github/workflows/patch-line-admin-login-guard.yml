name: Patch admin entry reliability

on:
  push:
    paths:
      - '.github/workflows/patch-line-admin-login-guard.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch admin entry
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = '  if(action==="select-role-admin"){\n    guestReadOnlyMode = false;\n    (async ()=>{\n      loginError=""; authFormError="";\n      try{'
          new = '  if(action==="select-role-admin"){\n    guestReadOnlyMode = false;\n    loginError=""; authFormError="";\n    appPhase="admin-login";\n    render();\n    (async ()=>{\n      try{'
          assert old in s, 'select-role-admin target not found'
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Verify patch
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'if(action==="select-role-admin")' index.html
          grep -Fq 'appPhase="admin-login";' index.html

      - name: Commit patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Fix admin entry on iOS Safari"
          git push
