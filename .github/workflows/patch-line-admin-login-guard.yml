name: Patch LINE admin login guard

on:
  push:
    paths:
      - '.github/workflows/patch-line-admin-login-guard.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch admin login for LINE in-app browser
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = '''  if(action==="admin-login-submit"){
    if(loginBusy) return;
    const remaining = lockoutRemainingSeconds();'''
          new = '''  if(action==="admin-login-submit"){
    if(loginBusy) return;
    if(isLineInAppBrowser()){
      loginError="目前使用 LINE 內建瀏覽器，Firebase 登入驗證可能無法正常完成。請點右下角選單，改用 Safari 或 Chrome 開啟 BXH ARENA 後再登入。";
      authVerifying=false;
      loginBusy=false;
      render();
      return;
    }
    const remaining = lockoutRemainingSeconds();'''
          assert old in s, 'admin-login-submit target not found'
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')

      - name: Verify patch
        shell: bash
        run: |
          set -euo pipefail
          grep -q '目前使用 LINE 內建瀏覽器，Firebase 登入驗證可能無法正常完成' index.html

      - name: Commit patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Guard admin login in LINE in-app browser"
          git push
