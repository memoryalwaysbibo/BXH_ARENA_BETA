name: Apply mobile auth reconnect fix

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-mobile-auth-reconnect.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Patch login reconnect without rebuilding credential fields
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          old_player = '''    if(!(window.cloudAuth && window.cloudAuth.isReady())){
      playerLoginBusy=true;playerLoginError="正在重新連線雲端…";render();
      Promise.resolve().then(async()=>{
        try{if(window.cloudSync&&window.cloudSync.connect)await window.cloudSync.connect();}catch(e){}
        playerLoginBusy=false;
        if(!(window.cloudAuth && window.cloudAuth.isReady())){
          playerLoginError="雲端服務尚未連線，請確認網路連線或稍後再試";
          render();
          return;
        }
        playerLoginError="";
        render();
        handleAction("player-email-signin",target);
      });
      return;
    }'''

          new_player = '''    if(!(window.cloudAuth && window.cloudAuth.isReady())){
      playerLoginBusy=true;playerLoginError="";
      try{ if(target) target.disabled=true; }catch(e){}
      showToast("正在重新連線雲端…");
      Promise.resolve().then(async()=>{
        try{
          if(window.cloudSync&&window.cloudSync.connect){
            await withLoginTimeout(window.cloudSync.connect(),LOGIN_TIMEOUT_MS);
          }
        }catch(e){}
        playerLoginBusy=false;
        try{ if(target) target.disabled=false; }catch(e){}
        if(!(window.cloudAuth && window.cloudAuth.isReady())){
          playerLoginError="雲端服務尚未連線，請確認網路連線或稍後再試";
          render();
          return;
        }
        playerLoginError="";
        handleAction("player-email-signin",target);
      });
      return;
    }'''

          old_admin = '''    if(!authAvailable()){ loginError="雲端服務尚未連線，請確認網路連線或稍後再試"; render(); return; }'''

          new_admin = '''    if(!authAvailable()){
      loginBusy=true; loginError="";
      try{ if(target) target.disabled=true; }catch(e){}
      showToast("正在重新連線雲端…");
      Promise.resolve().then(async()=>{
        try{
          if(window.cloudSync&&window.cloudSync.connect){
            await withLoginTimeout(window.cloudSync.connect(),LOGIN_TIMEOUT_MS);
          }
        }catch(e){}
        loginBusy=false;
        try{ if(target) target.disabled=false; }catch(e){}
        if(!authAvailable()){
          loginError="雲端服務尚未連線，請確認網路連線或稍後再試";
          render();
          return;
        }
        loginError="";
        handleAction("admin-login-submit",target);
      });
      return;
    }'''

          if old_player not in s:
              raise SystemExit('player reconnect target not found')
          if old_admin not in s:
              raise SystemExit('admin reconnect target not found')

          s = s.replace(old_player, new_player, 1)
          s = s.replace(old_admin, new_admin, 1)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Verify auth reliability regression
        run: node tests/auth-reliability.cjs

      - name: Commit patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "fix(beta): preserve credentials during auth reconnect"
          git push
