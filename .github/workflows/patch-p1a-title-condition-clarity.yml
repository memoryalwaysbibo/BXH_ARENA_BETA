name: P1-B Title Gallery Filters

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/patch-p1a-title-condition-clarity.yml'
      - '.github/scripts/patch_p1b_title_filters.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Apply P1-B patch
        run: python3 .github/scripts/patch_p1b_title_filters.py
      - name: Verify
        run: |
          grep -Fq "let titleGalleryFilter='all';" index.html
          grep -Fq "限定／特殊" index.html
          grep -Fq "此分類目前沒有稱號。" index.html
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "P1-B add title gallery quick filters"
          git push
