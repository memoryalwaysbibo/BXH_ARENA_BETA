name: Deploy Beta Firestore Rules

# Secret configured; authenticate through google-github-actions/auth
# 2026-09-15: trigger deploy for tester admin-equivalent tournament permissions
on:
  push:
    branches: [main]
    paths:
      - 'firestore.rules'
      - '.github/workflows/deploy-beta-firestore-rules.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: beta-firestore-rules
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify Beta target and rules
        shell: bash
        run: |
          set -euo pipefail
          test -s firestore.rules
          grep -q "validTesterTestCreate" firestore.rules
          grep -q "isTester() && tournamentExistsAfterFor(code)" firestore.rules
          grep -q "function isTournamentAdminEquivalent()" firestore.rules
          echo "Rules file present and tester admin-equivalent guards detected."

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_BXH_ARENA_BETA }}

      - name: Install Firebase CLI
        run: npm install --global firebase-tools

      - name: Create Firebase config
        shell: bash
        run: |
          cat > firebase.json <<'JSON'
          {
            "firestore": {
              "rules": "firestore.rules"
            }
          }
          JSON
          cat firebase.json

      - name: Deploy Firestore rules to Beta
        shell: bash
        run: |
          set -euo pipefail
          firebase deploy --only firestore:rules --project bxh-arena-beta --non-interactive

      - name: Deployment summary
        run: |
          echo "Firestore rules deployed to bxh-arena-beta."
          echo "Tester tournament permissions are admin-equivalent; tester room delete remains owner-only."
