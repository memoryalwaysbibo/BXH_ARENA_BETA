name: Diagnose BUG 012 tournament cloud disconnect

on:
  push:
    paths:
      - '.github/workflows/diagnose-bug012.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect exact tournament create paths
        shell: python
        run: |
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          lines=s.splitlines()
          needles=['async createRoom','createRoom(state','createRoom:','createRoom(', 'async function publishRegistrationConfig','function publishRegistrationConfig']
          for needle in needles:
            print('\n===== NEEDLE:',needle,'=====')
            found=0
            for i,line in enumerate(lines):
              if needle in line:
                found+=1
                a=max(0,i-15); b=min(len(lines),i+90)
                for j in range(a,b): print(f'{j+1}: {lines[j][:2500]}')
                if found>=5: break
            if not found: print('NO HITS')
          r=Path('firestore.rules').read_text(encoding='utf-8')
          a=r.index('match /publicTournaments/{code}')
          b=r.index('match /ladderPlayers/{uid}',a)
          print('\n===== PUBLIC TOURNAMENT RULE BLOCK =====')
          print(r[a:b])
