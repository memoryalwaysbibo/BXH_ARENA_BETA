name: Diagnose BUG 012 tournament cloud disconnect

on:
  push:
    paths:
      - '.github/workflows/diagnose-bug012.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect createRoom write and public rule
        shell: python
        run: |
          from pathlib import Path
          lines=Path('index.html').read_text(encoding='utf-8').splitlines()
          print('===== createRoom payload/write tail =====')
          for j in range(19645-1,19745): print(f'{j+1}: {lines[j][:3000]}')
          r=Path('firestore.rules').read_text(encoding='utf-8')
          a=r.index('match /publicTournaments/{code}')
          # print enough chars to include create/update branches
          print('\n===== publicTournaments rules =====')
          print(r[a:a+18000])
