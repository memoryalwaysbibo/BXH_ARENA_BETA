name: Apply HTTPS redirect safeguard

on:
  push:
    branches:
      - fix/force-https-20260918
    paths:
      - .github/workflows/apply-https-redirect.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Add HTTPS redirect before application startup
        shell: python
        run: |
          from pathlib import Path

          snippet = "\n".join([
              "<script>",
              "(function enforceSecureConnection(){",
              "  var isLocalHost=/^(localhost|127(?:\\.\\d{1,3}){3}|\\[::1\\])$/.test(window.location.hostname);",
              "  if(window.location.protocol==='http:'&&!isLocalHost){",
              "    window.location.replace('https://'+window.location.host+window.location.pathname+window.location.search+window.location.hash);",
              "  }",
              "})();",
              "</script>",
              "",
          ])
          files = [
              Path("index.html"),
              Path("install/black-gold-tech/index.html"),
              Path("install/white-gold/index.html"),
          ]
          for path in files:
              text = path.read_text(encoding="utf-8")
              if "function enforceSecureConnection()" in text:
                  continue
              marker = "<head>\n"
              if marker not in text:
                  raise SystemExit(f"<head> marker missing: {path}")
              path.write_text(text.replace(marker, marker + snippet, 1), encoding="utf-8")

      - name: Verify redirect behavior guard
        shell: bash
        run: |
          set -euo pipefail
          for file in index.html install/black-gold-tech/index.html install/white-gold/index.html; do
            grep -Fq "function enforceSecureConnection()" "$file"
            grep -Fq "window.location.protocol==='http:'" "$file"
            grep -Fq "window.location.replace('https://'" "$file"
          done
          git diff --check

      - name: Commit patch and remove one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/apply-https-redirect.yml
          git add index.html install/black-gold-tech/index.html install/white-gold/index.html
          git add -u .github/workflows/apply-https-redirect.yml
          git commit -m "fix: force secure HTTPS connections"
          git push
