name: Diagnose tester ranked room blocker
on:
  push:
    branches: [main]
    paths: ['.github/workflows/inspect-test-ladder-hooks.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect every ranked-mode gate
        shell: python
        run: |
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8'); lines=s.splitlines()
          keys=['set-ladder-mode','ladderMode=isTester','ladderMode="general"','testLadderEnabled','isTester()']
          hits=[]
          for i,l in enumerate(lines):
            if any(k in l for k in keys): hits.append(i)
          seen=set()
          for i in hits:
            a=max(0,i-8); b=min(len(lines),i+16)
            if any(a<=x<b for x in seen): continue
            seen.update(range(a,b))
            print(f'===== {a+1}-{b} =====')
            for n in range(a,b): print(f'{n+1}: {lines[n][:2200]}')
