name: Locate existing experimental player pool
on:
  push:
    branches: [main]
    paths: ['.github/workflows/replace-test-player-pool-64.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Print exact test-list implementation
        shell: python
        run: |
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          lines=s.splitlines()
          keys=['內建 80 位測試玩家','80 位測試玩家','隨機 8 位','隨機 16 位','隨機 32 位','隨機 64 位','測試名單','TEST_PLAYER','testPlayer','testNames','samplePlayers']
          found=set()
          for key in keys:
            for i,line in enumerate(lines):
              if key.lower() in line.lower():
                a=max(0,i-18); b=min(len(lines),i+19)
                sig=(a,b)
                if sig in found: continue
                found.add(sig)
                print(f'===== {key} @ line {i+1} =====')
                for n in range(a,b): print(f'{n+1}: {lines[n][:1200]}')
          if not found: raise SystemExit('No test-list hooks found')
