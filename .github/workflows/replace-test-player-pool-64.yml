name: Apply BXH experimental 64 player pool
on:
  push:
    branches: [main]
    paths: ['.github/workflows/replace-test-player-pool-64.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace BXH_TEST_PLAYER_POOL
        shell: python
        run: |
          from pathlib import Path
          import re
          p=Path('index.html'); s=p.read_text(encoding='utf-8')
          names=['巴哈','莫札特','貝多芬','蕭邦','舒伯特','柴可夫斯基','海頓','布拉姆斯','華格納','維瓦第','德布西','史特拉汶斯基','馬勒','拉赫曼尼諾夫','韓德爾','李斯特','威爾第','普契尼','孟德爾頌','白遼士','舒曼','達文西','米開朗基羅','拉斐爾','梵谷','莫內','畢卡索','林布蘭','達利','馬諦斯','高更','塞尚','克林姆','孟克','維梅爾','安迪·沃荷','卡拉瓦喬','波提切利','康丁斯基','德加','羅丹','葛飾北齋','愛因斯坦','牛頓','伽利略','居禮夫人','達爾文','特斯拉','法拉第','麥克斯韋','門德列夫','哥白尼','波耳','普朗克','巴斯德','海森堡','薛丁格','霍金','費曼','拉塞福','道爾頓','圖靈','林奈','哈伯']
          assert len(names)==64 and len(set(names))==64
          new='const BXH_TEST_PLAYER_POOL = [\n  '+',\n  '.join('"'+x+'"' for x in names)+'\n];'
          s,n=re.subn(r'const BXH_TEST_PLAYER_POOL\s*=\s*\[.*?\];',new,s,count=1,flags=re.S)
          assert n==1, 'BXH_TEST_PLAYER_POOL exact block not found'
          s=s.replace('從內建 80 位測試玩家中隨機抽選','從內建 64 位實驗玩家中隨機抽選')
          p.write_text(s,encoding='utf-8')
      - name: Verify
        shell: python
        run: |
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          m=re.search(r'const BXH_TEST_PLAYER_POOL\s*=\s*\[(.*?)\];',s,re.S); assert m
          vals=re.findall(r'"([^"]+)"',m.group(1)); assert len(vals)==64 and len(set(vals))==64
          assert vals[0]=='巴哈' and vals[-1]=='哈伯'
          assert '從內建 64 位實驗玩家中隨機抽選' in s
          for n in (8,16,32,64): assert f'隨機 {n} 位' in s
          assert 'source:"test"' in s
          print('PASS: requested 64 experimental players installed')
      - name: Commit
        shell: bash
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Use requested 64 experimental player IDs"
          git push
